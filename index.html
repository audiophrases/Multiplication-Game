<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multiplication Mania!</title>
  <style>
    :root {
      --primary: #4b9cff;
      --secondary: #ffcc4b;
      --bg: radial-gradient(circle at top left, #f7fbff, #dfe9f7);
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--bg);
      color: #0f1b2d;
      font-size: clamp(18px, 2vw, 22px);
    }

    header, footer {
      background: linear-gradient(90deg, #0f1b2d, #183c5a);
      color: #fff;
      padding: 18px 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      letter-spacing: 0.3px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #header-info { font-size: 1.2em; font-weight: 700; }
    #header-info span { margin: 0 8px; }

    button {
      padding: 16px 26px;
      margin: 8px;
      font-size: 1.05em;
      font-weight: 700;
      cursor: pointer;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #fff;
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    button:hover { transform: translateY(-1px); box-shadow: 0 10px 18px rgba(0,0,0,0.18); }
    button:active { transform: translateY(0); box-shadow: 0 4px 10px rgba(0,0,0,0.16); }
    button:disabled { background:#9fbada; cursor: not-allowed; box-shadow:none; }

    .secondary { background: var(--secondary); color: #1e2e3a; }

    .card {
      background: #fff;
      padding: clamp(22px, 3vw, 32px);
      border-radius: 18px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.15);
      max-width: 960px;
      width: 100%;
      text-align: center;
    }

    h1, h2, h3 { margin: 0 0 12px 0; font-weight: 800; }
    .subtitle { margin: 6px 0 18px; color: #354b63; }

    #wheelCanvas { border:4px solid #0f1b2d; border-radius:50%; max-width: 360px; width:100%; height:auto; }
    @keyframes spin { from { transform:rotate(0deg);} to{transform:rotate(360deg);} }
    #wheelCanvas.spinning { animation: spin 1s linear 3; }

    .question {
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 800;
      margin: 16px 0 12px;
      color: #0f1b2d;
    }

    .voice-status {
      font-size: 1.05em;
      color: #354b63;
      min-height: 32px;
      margin-bottom: 10px;
    }

    .bad { color: #c0392b; font-weight: 700; }
    .good { color: #1e8449; font-weight: 700; }

    table { border-collapse: collapse; margin: 18px auto; width: 100%; max-width: 640px; font-size: 1.05em; }
    td, th { border: 1px solid #c6d2e2; padding: 10px 14px; text-align: center; }
    th { background: #f1f6fb; }

    .table-picker {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(54px, 1fr));
      gap: 10px;
      margin: 14px 0 4px;
    }

    .table-choice {
      background: #f1f6fb;
      border: 2px solid #c6d2e2;
      color: #0f1b2d;
      border-radius: 12px;
      font-weight: 800;
      padding: 12px 0;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.1s ease, border-color 0.2s ease;
      box-shadow: 0 6px 12px rgba(0,0,0,0.12);
    }

    .table-choice:hover { transform: translateY(-1px); border-color: var(--primary); box-shadow: 0 10px 16px rgba(0,0,0,0.15); }
    .table-choice:active { transform: translateY(0); box-shadow: 0 6px 12px rgba(0,0,0,0.12); }

    .heard-wrapper { margin: 6px 0 2px; }
    .heard-label { font-size: 0.95em; color: #4b5f75; }
    .heard-number {
      min-height: clamp(3rem, 6vw, 4.4rem);
      font-size: clamp(2.8rem, 6vw, 4.8rem);
      font-weight: 900;
      text-shadow: 0 2px 6px rgba(0,0,0,0.2);
      opacity: 0;
      transform: translateY(8px) scale(0.96);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .heard-number.visible { opacity: 1; transform: translateY(0) scale(1); }
    .heard-number.correct { color: #1e8449; }
    .heard-number.incorrect { color: #c0392b; }

    .table-preview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px;
      margin: 12px 0 4px;
      color: #1b3145;
      font-weight: 600;
    }

    #overlay {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.7);
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:1.2rem;
      padding: 14px;
    }
    #overlay .content {
      background:#112132;
      padding:28px;
      border-radius:14px;
      max-width: 520px;
      width: 100%;
      text-align:center;
      box-shadow:0 10px 22px rgba(0,0,0,0.35);
    }
    #overlay.hidden { display:none; }

    .answer-input {
      font-size: 2rem;
      padding: 12px;
      border-radius: 12px;
      border: 3px solid #c6d2e2;
      width: 160px;
      text-align: center;
      margin: 16px auto;
      display: block;
      color: #0f1b2d;
      font-weight: 800;
    }
    .answer-input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 12px rgba(75, 156, 255, 0.4);
    }
    .answer-input::placeholder {
      color: #cbd5e1;
      font-weight: 400;
    }
    /* Hide arrows for number input */
    .answer-input::-webkit-outer-spin-button,
    .answer-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .answer-input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
    .answer-input:disabled { background:#eef3f9; color:#7a8ea3; }

    /* MODE PICKER */
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      margin-top: 8px;
    }

    .mode-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: #f1f6fb;
      color: #0f1b2d;
      border: 2px solid #c6d2e2;
      padding: 24px 18px;
      text-align: center;
      white-space: normal;
    }

    .mode-card:hover { border-color: var(--primary); }
    .mode-icon { font-size: 2.6rem; line-height: 1; }
    .mode-name { font-size: 1.15em; font-weight: 800; }
    .mode-desc { font-size: 0.78em; font-weight: 500; color: #41586f; line-height: 1.45; }

    /* LADDER MODE */
    .ladder-layout {
      display: flex;
      gap: 28px;
      align-items: stretch;
      justify-content: center;
      flex-wrap: wrap;
    }

    .ladder-rail {
      display: flex;
      flex-direction: column-reverse;
      gap: 4px;
      flex: 0 0 104px;
      width: 104px;
      padding: 12px 30px 12px 12px;
      background: linear-gradient(180deg, #eaf2fb, #dae6f4);
      border: 2px solid #c6d2e2;
      border-radius: 14px;
    }

    .ladder-play { flex: 1 1 320px; min-width: 270px; }

    .rung {
      position: relative;
      height: 13px;
      border-radius: 4px;
      background: #fff;
      border-left: 5px solid #cbd8e7;
      box-shadow: inset 0 0 0 1px #dae3ee;
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .rung.z1 { border-left-color: #3fa96a; }
    .rung.z2 { border-left-color: #3d8fd6; }
    .rung.z3 { border-left-color: #d59b1f; }
    .rung.z4 { border-left-color: #e07a3c; }
    .rung.z5 { border-left-color: #c0392b; }

    .rung.done { background: #a9d0f7; }
    .rung.current {
      background: var(--secondary);
      transform: scaleX(1.12);
      box-shadow: 0 0 12px rgba(255, 204, 75, 0.85);
    }

    .rung .climber {
      position: absolute;
      right: -32px;
      top: -9px;
      font-size: 1.5rem;
      line-height: 1;
    }

    .rung.best-mark::after {
      content: '★';
      position: absolute;
      right: -20px;
      top: -6px;
      color: #e0a800;
      font-size: 0.85rem;
    }

    .rung-badge { font-weight: 800; color: #1b3145; margin-bottom: 4px; }

    .zone-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.68em;
      color: #fff;
      margin-right: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .zone-tag.z1 { background: #3fa96a; }
    .zone-tag.z2 { background: #3d8fd6; }
    .zone-tag.z3 { background: #d59b1f; }
    .zone-tag.z4 { background: #e07a3c; }
    .zone-tag.z5 { background: #c0392b; }
  </style>
</head>
<body>

<header>
  <div id="header-info">
    <span id="levelDisplay">Level: 1</span>
  </div>
  <button id="highScoresBtn" class="secondary">Table Times</button>
</header>

<main id="main"></main>

<footer>
  <button id="resetBtn">Reset Progress</button>
</footer>

<div id="overlay" class="hidden">
  <div class="content" id="overlayContent"></div>
</div>

<script>
(() => {
  // AUDIO
  const audioSuccess   = new Audio('success.mp3');
  const audioCountdown = new Audio('countdown.mp3');
  const audioSpin      = new Audio('spin.mp3');
  const audioLevelUp   = new Audio('level-up.mp3');
  const audioFail      = new Audio('fail.mp3');

  // SPEECH
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let activeRecognizer = null;
  let keepListening = false;

  // KEYS
  const GAME_KEY = 'mulGameState';
  const HS_KEY   = 'mulTableTimes';

  // MESSAGES
  const CELEBRATIONS = [
    "Great job!", "Well done!", "Fantastic!",
    "You're amazing!", "Keep it up!", "Bravo!",
    "Excellent work!", "You're a star!"
  ];

  let tableStartTime = null;

  // STATE
  const state = { level:1, currentTable:null, mode:null, rung:1, bestRung:1 };

  function saveState(){ localStorage.setItem(GAME_KEY, JSON.stringify(state)); }
  function loadState(){
    const s = localStorage.getItem(GAME_KEY);
    if(s) Object.assign(state, JSON.parse(s));
  }
  function clearState(){ localStorage.removeItem(GAME_KEY); }

  function getHighScores(){
    const v = localStorage.getItem(HS_KEY);
    return v ? JSON.parse(v) : [];
  }
  function saveHighScore(table, timeSeconds, init){
    const hs = getHighScores();
    hs.push({ table, timeSeconds, initials:init, date:new Date().toLocaleDateString() });
    hs.sort((a,b)=>a.timeSeconds - b.timeSeconds);
    localStorage.setItem(HS_KEY, JSON.stringify(hs.slice(0,10)));
  }

  // UI
  const main          = document.getElementById('main');
  const overlay       = document.getElementById('overlay');
  const overlayContent= document.getElementById('overlayContent');
  const levelDisplay  = document.getElementById('levelDisplay');

  function updateHeader(){
    if(state.mode === 'ladder'){
      levelDisplay.textContent = `Rung ${state.rung} of ${LADDER_RUNGS} — best ${state.bestRung}`;
    } else if(state.mode === 'tables'){
      levelDisplay.textContent = 'Level: ' + state.level;
    } else {
      levelDisplay.textContent = 'Multiplication Mania';
    }
    saveState();
  }

  function showOverlay(html){
    stopListening();
    overlayContent.innerHTML = html;
    overlay.classList.remove('hidden');
  }
  function hideOverlay(){
    overlay.classList.add('hidden');
  }

  document.getElementById('highScoresBtn').onclick = () => {
    const hs = getHighScores();
    let html = `<h2>Fastest Finishes</h2><ol>`;
    if(!hs.length){
      html += `<li>No recorded times yet.</li>`;
    } else {
      hs.forEach(e=> html+=`<li>${e.initials} — Table ${e.table} in ${e.timeSeconds}s (${e.date})</li>`);
    }
    html += `</ol>`;

    const tricky = trickiestFacts(5);
    html += `<h2>Tricky For You</h2>`;
    if(!tricky.length){
      html += `<p>Nothing yet — these appear once you've missed a fact a couple of times.</p>`;
    } else {
      html += `<p>These are pushed higher up the ladder so you meet them more often.</p><ol>`;
      tricky.forEach(t => html += `<li>${t.key.replace('x',' × ')} — missed ${t.misses} of ${t.attempts}</li>`);
      html += `</ol>`;
    }
    html += `<button id="closeHS">Close</button>`;
    showOverlay(html);
    document.getElementById('closeHS').onclick = hideOverlay;
  };

  document.getElementById('resetBtn').onclick = () => {
    if(confirm('Clear progress, recorded times & what the ladder has learned about you?')){
      clearState();
      localStorage.removeItem(HS_KEY);
      localStorage.removeItem('mulFactStats');
      location.reload();
    }
  };

  // SPEECH HELPERS
  function stopListening(){
    keepListening = false;
    if(activeRecognizer){
      activeRecognizer.onresult = null;
      activeRecognizer.onerror = null;
      activeRecognizer.onend = null;
      try { activeRecognizer.stop(); } catch(_) {}
      activeRecognizer = null;
    }
  }

  function requireSpeechRecognition(){
    if(!SpeechRecognition){
      showOverlay(`<h2>Voice input unavailable</h2><p>Your browser needs speech recognition (try Chrome or Edge). Keyboard play isn't required, but you may need a supported browser.</p>`);
      return false;
    }
    return true;
  }

  function parseSpokenNumber(text){
    if(!text) return NaN;
    const cleaned = text.toLowerCase();
    const digitMatch = cleaned.match(/\d+/);
    if(digitMatch) return parseInt(digitMatch[0],10);

    const words = cleaned.replace(/[^a-z\s-]/g,' ').split(/\s+/).filter(Boolean);
    const baseMap = {
      zero:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9,
      ten:10, eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, sixteen:16, seventeen:17, eighteen:18, nineteen:19,
      twenty:20, thirty:30, forty:40, fifty:50, sixty:60, seventy:70, eighty:80, ninety:90,
      hundred:100
    };

    const map = { ...baseMap };
    const homophones = {
      zero: ['oh', 'o', 'owe'],
      one: ['won'],
      two: ['too', 'to'],
      four: ['for', 'fore'],
      eight: ['ate'],
      forty: ['fourty']
    };

    Object.entries(homophones).forEach(([canonical, variants]) => {
      const val = baseMap[canonical];
      variants.forEach(v => map[v] = val);
    });

    let total = 0; let current = 0; let found = false;
    words.forEach(w => {
      const val = map[w];
      if(val === undefined) return;
      found = true;
      if(val === 100){
        current = Math.max(1, current) * val;
      } else if(val >= 20){
        current += val;
      } else {
        current += val;
      }
    });
    if(found){
      total += current;
      return total;
    }
    return NaN;
  }

  function listenForNumber(expected, statusEl, onCorrect, onMismatch, heardEl, inputEl){
    if(!requireSpeechRecognition()) return;
    stopListening();
    keepListening = true;

    if(inputEl){
      inputEl.value = '';
      inputEl.focus();
      inputEl.oninput = () => {
        if(parseInt(inputEl.value, 10) === expected){
          inputEl.oninput = null;
          const val = parseInt(inputEl.value, 10);
          statusEl.innerHTML = `<span class="good">Typed ${val}. Correct!</span>`;
          audioSuccess.play();
          const oldKeep = keepListening;
          stopListening();
          if (oldKeep) setTimeout(() => onCorrect('typed', val), 600);
        }
      };
    }

    let heardTimeout = null;

    const showHeard = (val, isCorrect) => {
      if(!heardEl) return;
      heardEl.textContent = isNaN(val) ? '??' : val;
      heardEl.classList.remove('correct','incorrect','visible');
      heardEl.classList.add(isCorrect ? 'correct' : 'incorrect','visible');
      clearTimeout(heardTimeout);
      heardTimeout = setTimeout(()=>{
        heardEl.classList.remove('visible');
      }, 2000);
    };

    const startRecognition = () => {
      if(!keepListening) return;
      statusEl.textContent = 'Listening...';
      const rec = new SpeechRecognition();
      activeRecognizer = rec;
      rec.lang = 'en-US';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.continuous = false;

      rec.onresult = (e) => {
        const transcript = Array.from(e.results).map(r=>r[0].transcript).join(' ');
        const val = parseSpokenNumber(transcript);
        if(val === expected){
          if(inputEl) inputEl.oninput = null;
          showHeard(val, true);
          keepListening = false;
          statusEl.innerHTML = `<span class="good">Heard "${transcript.trim()}" → ${val}. Correct!</span>`;
          audioSuccess.play();
          rec.stop();
          setTimeout(() => onCorrect(transcript.trim(), val), 600);
        } else {
          showHeard(val, false);
          onMismatch && onMismatch(val, transcript.trim());
          statusEl.innerHTML = `<span class="bad">Heard "${transcript.trim()}"${isNaN(val)?'':` → ${val}`} — try again.</span>`;
        }
      };

      rec.onerror = () => {
        statusEl.textContent = 'Had trouble hearing you. Trying again...';
      };

      rec.onend = () => {
        if(keepListening) setTimeout(startRecognition, 250);
      };

      rec.start();
    };

    startRecognition();
  }

  // FLOW
  function startGame(){
    stopListening();
    loadState();
    showModePicker();
  }

  function showModePicker(){
    stopListening();
    state.mode = null;
    updateHeader();
    main.innerHTML = `
      <div class="card">
        <h2>Choose your game</h2>
        <p class="subtitle">Two ways to practise. Say your answer or type it — both work.</p>
        <div class="mode-grid">
          <button class="mode-card" id="modeTables">
            <span class="mode-icon">🎡</span>
            <span class="mode-name">Tables Adventure</span>
            <span class="mode-desc">Pick or spin a single table, then work it from adding up to a timed quiz.</span>
          </button>
          <button class="mode-card" id="modeLadder">
            <span class="mode-icon">🪜</span>
            <span class="mode-name">Ladder Climb</span>
            <span class="mode-desc">All tables mixed across ${LADDER_RUNGS} rungs of rising difficulty. Right answer climbs, wrong answer drops one — you're never out. Best so far: rung ${state.bestRung||1}.</span>
          </button>
        </div>
      </div>`;

    document.getElementById('modeTables').onclick = startTablesMode;
    document.getElementById('modeLadder').onclick = () => {
      if(state.rung > 1 && !confirm(`Continue your climb at rung ${state.rung}?`)) state.rung = 1;
      startLadderMode();
    };
  }

  function startTablesMode(){
    stopListening();
    state.mode = 'tables';
    const hasProgress = state.level>1 || state.currentTable;
    if(hasProgress && confirm(`Continue at Level ${state.level}?`)){
      nextStep();
    } else {
      state.level=1; state.currentTable=null;
      saveState();
      pickTable();
    }
  }

  function pickTable(){
    stopListening();
    main.innerHTML = `
      <div class="card">
        <h2>Choose a Times Table</h2>
        <p class="subtitle">Start anywhere you like. You can still spin the wheel for surprises later!</p>
        <div class="table-picker">${Array.from({length:10},(_,i)=>`<button class="table-choice" data-table="${i+1}">${i+1}</button>`).join('')}</div>
        <div class="voice-status" id="pickStatus">Select a table to begin.</div>
        <button id="randomTable" class="secondary">Spin the Wheel Instead</button>
      </div>`;

    document.querySelectorAll('.table-choice').forEach(btn=>{
      btn.onclick = () => {
        const val = parseInt(btn.dataset.table,10);
        if(isNaN(val)) return;
        state.currentTable = val;
        state.level = 1;
        tableStartTime = null;
        saveState();
        showOverlay(`
          <h2>Table of ${val} Selected</h2>
          <p>${CELEBRATIONS[Math.floor(Math.random()*CELEBRATIONS.length)]}</p>
          <p>We'll listen for your answers — no typing needed.</p>
          <button id="startPractice">Start Practicing</button>`);
        document.getElementById('startPractice').onclick = () => {
          hideOverlay();
          startAdditionPractice();
        };
      };
    });

    document.getElementById('randomTable').onclick = spinWheel;
  }

  function nextStep(){
    updateHeader();
    if(state.level>10) return winGame();
    if(state.level%2===1) spinWheel();
    else                    startQuiz();
  }

  // WHEEL
  function spinWheel(){
    stopListening();
    main.innerHTML = `
      <div class="card">
        <h2>Spin to pick a table</h2>
        <canvas id="wheelCanvas" width="360" height="360"></canvas>
        <p class="subtitle">Every table up to 10 is waiting for you. Tap the wheel and get ready to speak your answers!</p>
        <button id="spinBtn">Spin the Wheel</button>
      </div>`;
    const canvas = document.getElementById('wheelCanvas');
    const ctx    = canvas.getContext('2d');
    const R=160, seg=10;
    for(let i=0;i<seg;i++){
      const a=(i/seg)*2*Math.PI;
      ctx.beginPath();
      ctx.moveTo(180,180);
      ctx.arc(180,180,R, a, a+2*Math.PI/seg);
      ctx.fillStyle=`hsl(${i*36},70%,60%)`;
      ctx.fill(); ctx.stroke();
      ctx.save();
      ctx.translate(180,180);
      ctx.rotate(a+Math.PI/seg);
      ctx.fillStyle='#000';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText(i+1, R*0.6,8);
      ctx.restore();
    }
    ctx.fillStyle='red';
    ctx.beginPath();
    ctx.moveTo(180,16); ctx.lineTo(166,50); ctx.lineTo(194,50);
    ctx.fill();

    const btn = document.getElementById('spinBtn');
    btn.onclick = () => {
      audioSpin.play();
      btn.disabled = true;
      canvas.classList.add('spinning');
      setTimeout(()=>{
        canvas.classList.remove('spinning');
        const pick = Math.floor(Math.random()*10)+1;
        state.currentTable = pick;
        tableStartTime = null;
        saveState();
        audioLevelUp.play();
        showOverlay(`
          <h2>🎉 Table of ${pick}! 🎉</h2>
          <p>${CELEBRATIONS[Math.floor(Math.random()*CELEBRATIONS.length)]}</p>
          <p>We'll listen for your answers — no typing needed.</p>
          <button id="gotable">Go!</button>`);
        document.getElementById('gotable').onclick = () => {
          hideOverlay();
          startAdditionPractice();
        };
      },3000);
    };
  }

  // ADDITION PRACTICE
  function startAdditionPractice(){
    stopListening();
    const n = state.currentTable;
    let step = 0;

    main.innerHTML = `
      <div class="card">
        <h2>Practice Adding ${n}</h2>
        <div class="question" id="addQ">0 + ${n} = ?</div>
        <input type="number" id="answerInput" class="answer-input" placeholder="?">
        <div class="heard-wrapper"><div class="heard-label">Heard:</div><div class="heard-number" id="addHeard"></div></div>
        <div class="voice-status" id="addStatus">Press Start to begin.</div>
        <button id="addSubmit">Start</button>
      </div>
    `;

    const btn      = document.getElementById('addSubmit');
    const qEl      = document.getElementById('addQ');
    const statusEl = document.getElementById('addStatus');
    const inputEl  = document.getElementById('answerInput');

    const ask = () => {
      const expected = (step+1) * n;
      qEl.textContent = `${step*n} + ${n} = ?`;
      statusEl.textContent = `Say or type "${expected}" to move on.`;
      listenForNumber(expected, statusEl, () => {
        step++;
        if(step === 10){
          audioLevelUp.play();
          updateHeader();
          showOverlay(`
            <h2>${CELEBRATIONS[Math.floor(Math.random()*CELEBRATIONS.length)]}</h2>
            <p>Let's fill in a few blanks for ${n}.</p>
            <button id="contFill">Continue</button>`);
          document.getElementById('contFill').onclick = () => {
            hideOverlay();
            startFillMode();
          };
          return;
        }
        statusEl.textContent = 'Great! Next one coming up...';
        setTimeout(ask, 700);
      }, () => {}, document.getElementById('addHeard'), inputEl);
    };

    btn.onclick = () => {
      if(!requireSpeechRecognition()) return;
      btn.disabled = true;
      tableStartTime = Date.now();
      ask();
    };
  }

  // FILL-IN (odd levels)
  function startFillMode(){
    stopListening();
    const n = state.currentTable;
    const bmap={1:4,3:4,5:5,7:6,9:7};
    const blankCount = bmap[state.level]||4;

    const all = Array.from({length:10},(_,i)=>i+1);
    const blanks = shuffle(all.slice()).slice(0,blankCount);
    let idx = 0;

    main.innerHTML = `<div class="card">
      <h2>Table of ${n} — Fill ${blankCount} Blanks</h2>
      <p class="subtitle">Type or say the missing answers.</p>
      <div class="question" id="fillQuestion">Ready?</div>
      <input type="number" id="answerInput" class="answer-input" placeholder="?">
      <div class="heard-wrapper"><div class="heard-label">Heard:</div><div class="heard-number" id="fillHeard"></div></div>
      <div class="voice-status" id="fillStatus">Press Start to begin.</div>
      <div class="table-preview">${all.map(i=>`<div>${n} × ${i} = ${blanks.includes(i)?'❓':'<strong>'+n*i+'</strong>'}</div>`).join('')}</div>
      <button id="fillStartBtn">Start</button>
    </div>`;

    const statusEl = document.getElementById('fillStatus');
    const qEl = document.getElementById('fillQuestion');
    const inputEl = document.getElementById('answerInput');

    const ask = () => {
      const i = blanks[idx];
      const expected = n * i;
      qEl.textContent = `${n} × ${i} = ?`;
      statusEl.textContent = `Say or type "${expected}"`;
      listenForNumber(expected, statusEl, () => {
        idx++;
        if(idx >= blanks.length){
          audioLevelUp.play();
          updateHeader();
          showOverlay(`
            <h2>🎉 ${CELEBRATIONS[Math.floor(Math.random()*CELEBRATIONS.length)]}</h2>
            <p>Get ready for a quick voice quiz on ${n}.</p>
            <button id="nextlvl">Continue</button>`);
          document.getElementById('nextlvl').onclick = () => {
            hideOverlay();
            state.level++;
            saveState();
            nextStep();
          };
          return;
        }
        statusEl.textContent = 'Nice! Here comes the next blank...';
        setTimeout(ask, 700);
      }, () => {}, document.getElementById('fillHeard'), inputEl);
    };

    document.getElementById('fillStartBtn').onclick = () => {
      if(!requireSpeechRecognition()) return;
      if(!tableStartTime) tableStartTime = Date.now();
      document.getElementById('fillStartBtn').disabled = true;
      ask();
    };
  }

  // QUIZ (even levels)
  function startQuiz(){
    stopListening();
    const n = state.currentTable;
    let qIdx=0;
    const questions = shuffle(Array.from({length:10},(_,i)=>i+1));

    main.innerHTML = `
      <div class="card">
        <h2>Table of ${n} — Challenge Quiz</h2>
        <p class="subtitle">Say or type each answer.</p>
        <div id="question" class="question">Press Start</div>
        <input type="number" id="answerInput" class="answer-input" placeholder="?">
        <div class="heard-wrapper"><div class="heard-label">Heard:</div><div class="heard-number" id="quizHeard"></div></div>
        <div class="voice-status" id="quizStatus">Press Start to begin.</div>
        <button id="submitQ">Start</button>
      </div>
    `;

    const btn      = document.getElementById('submitQ');
    const statusEl = document.getElementById('quizStatus');
    const qEl      = document.getElementById('question');
    const inputEl  = document.getElementById('answerInput');

    const ask = () => {
      const expected = n * questions[qIdx];
      let missedThis = false;
      qEl.textContent = `${n} × ${questions[qIdx]} = ?`;
      statusEl.textContent = `Say or type "${expected}"`;
      listenForNumber(expected, statusEl, () => {
        // One record per question: the quiz retries until correct, so "did they get
        // it first time" is the signal, and it feeds the ladder's personal history.
        recordAnswer(n, questions[qIdx], !missedThis);
        qIdx++;
        if(qIdx>=questions.length){
          const totalTime = Math.round((Date.now() - tableStartTime)/1000);
          audioLevelUp.play();
          updateHeader();
          const input = prompt('Enter your initials to record your time:', '');
          const init  = input ? input.toUpperCase().slice(0,3) : '';
          if(init) saveHighScore(n, totalTime, init);
          showOverlay(`
            <h2>🎉 ${CELEBRATIONS[Math.floor(Math.random()*CELEBRATIONS.length)]}</h2>
            <p>Total Time: ${totalTime}s</p>
            <button id="nextlvl2">Next Level</button>`);
          document.getElementById('nextlvl2').onclick = () => {
            hideOverlay();
            state.level++;
            saveState();
            nextStep();
          };
          return;
        }
        statusEl.textContent = 'Correct! Next question coming...';
        setTimeout(ask, 700);
      }, () => { missedThis = true; }, document.getElementById('quizHeard'), inputEl);
    };

    btn.onclick = () => {
      if(!requireSpeechRecognition()) return;
      btn.disabled = true;
      if(!tableStartTime) tableStartTime = Date.now();
      ask();
    };
  }

  // ================= DIFFICULTY MODEL =================
  // All 55 unique facts, easiest first. This is a taught order, not a computed one:
  // the x1 and x10 tables are cleared as whole blocks before the rest interleaves,
  // squares are grouped early because they get memorised as a set, and the x9 facts
  // sit high because the 10x-x trick is one more step, not one fewer.
  // Order is authored deliberately — edit this list to change what the ladder asks.
  const FACT_ORDER = [
    [1,1],  [1,10], [1,2],  [1,5],  [1,3],  [1,4],  [1,9],  [1,6],  [1,7],  [1,8],
    [10,10],[10,2], [10,5], [10,3], [10,4], [10,9], [10,6], [10,7], [10,8],
    [2,2],  [2,5],  [2,3],  [2,4],  [2,6],  [3,3],  [5,5],  [2,7],  [3,4],  [2,9],
    [4,4],  [2,8],  [5,3],  [5,4],  [5,6],  [6,6],  [7,7],  [9,9],  [5,7],  [5,9],
    [5,8],  [3,6],  [3,7],  [4,6],  [3,8],  [8,8],  [3,9],  [4,9],  [4,7],  [4,8],
    [9,6],  [9,7],  [9,8],  [6,7],  [6,8],  [7,8]
  ];

  // Both orientations map to the same rank: 2 x 5 and 5 x 2 are one fact.
  const FACT_RANK = (() => {
    const ranks = {};
    FACT_ORDER.forEach(([a, b], i) => { ranks[a + 'x' + b] = i; ranks[b + 'x' + a] = i; });
    return ranks;
  })();

  // Position in that order, spread evenly over 0-100.
  function factScore(a, b){
    if(!a || !b) return 0;
    const rank = FACT_RANK[a + 'x' + b];
    return rank === undefined ? 0 : Math.round(100 * rank / (FACT_ORDER.length - 1));
  }

  const digitsOf = n => String(n).split('').map(Number);

  // Carries generated while multiplying a multi-digit number by one digit.
  function partialCarries(multi, single){
    let carry = 0, count = 0;
    digitsOf(multi).reverse().forEach(d => {
      carry = Math.floor((d * single + carry) / 10);
      if(carry > 0) count++;
    });
    return count;
  }

  // Carries generated while adding the partial products together.
  function sumCarries(nums){
    const cols = nums.map(n => String(n).split('').reverse().map(Number));
    const len = Math.max(...cols.map(c => c.length));
    let carry = 0, count = 0;
    for(let i = 0; i < len; i++){
      carry = Math.floor((carry + cols.reduce((t, c) => t + (c[i] || 0), 0)) / 10);
      if(carry > 0) count++;
    }
    return count;
  }

  // Multi-digit difficulty. Carry load matters far more than digit count.
  // Scored in the order you'd write it out — longer number on top — so that
  // 47 x 3 and 3 x 47 are worth the same, and orientation is purely cosmetic.
  function multiScore(a0, b0){
    if(String(b0).length > String(a0).length || (String(b0).length === String(a0).length && b0 > a0)){
      [a0, b0] = [b0, a0];
    }
    const strip = n => { let z = 0; while(n % 10 === 0 && n > 0){ n /= 10; z++; } return [n, z]; };
    const [a, za] = strip(a0), [b, zb] = strip(b0);
    const da = digitsOf(a), db = digitsOf(b);

    let s = 22 * (da.length * db.length - 1);              // size of the digit-product grid
    da.forEach(x => db.forEach(y => { s += factScore(x, y) / 6; }));  // hardness of each pair
    db.forEach(y => { if(y) s += 7 * partialCarries(a, y); });        // carries within partials

    const partials = db.map((y, i) => a * y * Math.pow(10, db.length - 1 - i)).filter(p => p !== 0);
    if(partials.length > 1) s += 5 * sumCarries(partials);           // carries in the final sum

    s += 4 * (za + zb);                                    // trailing zeros are a shift, not a product
    s += 6 * Math.max(0, String(a0 * b0).length - 2);       // a big answer is more to hold and say
    return Math.max(0, Math.round(s));
  }

  // Unified scale: single-digit facts occupy 0-100, everything wider floors at 100,
  // so no two-digit question can appear before the whole times table is cleared.
  function difficulty(a, b){
    return (a <= 10 && b <= 10) ? factScore(a, b) : 100 + multiScore(a, b);
  }

  // ================= PERSONAL HISTORY =================
  // The scores above are what's hard for children in general. This layer is what's
  // hard for *this* child: a question they keep missing drifts up the ladder toward
  // the rungs they actually spend their time on, and one they've mastered drifts down.
  const MAX_SHIFT_UP   = 25;    // furthest a personal weakness can push a question up
  const MAX_SHIFT_DOWN = 12;    // furthest a mastered question can drift down
  const PRIOR_ATTEMPTS = 2;     // pseudo-attempts, so one slip doesn't swing the estimate
  const PRIOR_MISS     = 0.25;  // miss rate assumed before we know anything

  const storage = () => { try { return typeof localStorage === 'undefined' ? null : localStorage; } catch(_) { return null; } };

  let stats = (() => {
    try {
      const store = storage();
      const raw = store && JSON.parse(store.getItem('mulFactStats'));
      if(raw && raw.facts && raw.shapes) return raw;
    } catch(_) {}
    return { facts:{}, shapes:{} };
  })();

  function saveStats(){
    const store = storage();
    if(store) try { store.setItem('mulFactStats', JSON.stringify(stats)); } catch(_) {}
  }

  // Single-digit facts are tracked one by one; wider questions are tracked by shape,
  // because there are unboundedly many of them and missing 25 x 46 says nothing about 25 x 47.
  function questionKey(a, b){
    if(a <= 10 && b <= 10){
      const [x, y] = a <= b ? [a, b] : [b, a];
      return { bucket:'facts', key: x + 'x' + y };
    }
    const da = String(a).length, db = String(b).length;
    const [x, y] = da <= db ? [da, db] : [db, da];
    return { bucket:'shapes', key: x + 'd x ' + y + 'd' };
  }

  function recordAnswer(a, b, correct){
    const { bucket, key } = questionKey(a, b);
    const rec = stats[bucket][key] || (stats[bucket][key] = { n:0, w:0 });
    rec.n++;
    if(!correct) rec.w++;
    saveStats();
  }

  // How far this player's own history moves a question on the difficulty scale.
  function personalShift(a, b){
    const { bucket, key } = questionKey(a, b);
    const rec = stats[bucket][key];
    if(!rec || !rec.n) return 0;
    // Smoothed against a prior so the first miss doesn't declare a fact "hard".
    const missRate = (rec.w + PRIOR_ATTEMPTS * PRIOR_MISS) / (rec.n + PRIOR_ATTEMPTS);
    const delta = missRate - PRIOR_MISS;
    return delta >= 0
      ? Math.round(MAX_SHIFT_UP   * Math.min(1,  delta / (1 - PRIOR_MISS)))
      : Math.round(MAX_SHIFT_DOWN * Math.max(-1, delta / PRIOR_MISS));
  }

  function personalDifficulty(a, b){
    return difficulty(a, b) + personalShift(a, b);
  }

  function trickiestFacts(limit){
    return Object.entries(stats.facts)
      .filter(([, r]) => r.n >= 2 && r.w > 0)
      .map(([key, r]) => ({ key, misses: r.w, attempts: r.n, rate: r.w / r.n }))
      .sort((x, y) => y.rate - x.rate || y.misses - x.misses)
      .slice(0, limit);
  }

  // ================= LADDER MODE =================
  const LADDER_RUNGS = 30;

  // Difficulty centre of each rung, interpolated between these anchors.
  const RUNG_ANCHORS = [[1,2],[6,30],[12,58],[18,95],[21,120],[24,150],[27,195],[30,265]];

  function rungCenter(r){
    for(let i = 0; i < RUNG_ANCHORS.length - 1; i++){
      const [r1, c1] = RUNG_ANCHORS[i], [r2, c2] = RUNG_ANCHORS[i+1];
      if(r >= r1 && r <= r2) return c1 + (c2 - c1) * (r - r1) / (r2 - r1);
    }
    return RUNG_ANCHORS[RUNG_ANCHORS.length - 1][1];
  }

  // Window around the centre a question may be drawn from.
  const rungHalfWidth = r => r <= 4 ? 14 : (r <= 18 ? 9 : 16);

  // Which operand shapes a rung is allowed to serve, so big numbers can't arrive early.
  function rungShapes(r){
    if(r <= 18) return ['1x1'];
    if(r <= 23) return ['1x1','1x2'];
    if(r <= 27) return ['1x2','1x3','2x2'];
    return ['2x2','1x3','2x3'];
  }

  const ZONES = [
    { max:6,  name:'Ground', cls:'z1' },
    { max:12, name:'Lower',  cls:'z2' },
    { max:18, name:'Middle', cls:'z3' },
    { max:23, name:'Upper',  cls:'z4' },
    { max:30, name:'Summit', cls:'z5' }
  ];
  const zoneOf = r => ZONES.find(z => r <= z.max) || ZONES[ZONES.length - 1];

  function eachPairOfShape(shape, visit){
    switch(shape){
      case '1x1': for(let a=1;a<=10;a++)   for(let b=a;b<=10;b++)  visit(a,b); break;
      case '1x2': for(let a=11;a<=99;a++)  for(let b=2;b<=9;b++)   visit(a,b); break;
      case '2x2': for(let a=11;a<=99;a++)  for(let b=a;b<=99;b++)  visit(a,b); break;
      case '1x3': for(let a=101;a<=999;a+=2) for(let b=2;b<=9;b++) visit(a,b); break;
      case '2x3': for(let a=101;a<=999;a+=7) for(let b=11;b<=99;b++) visit(a,b); break;
    }
  }

  const rungWindow = r => [rungCenter(r) - rungHalfWidth(r), rungCenter(r) + rungHalfWidth(r)];

  // Candidates for a rung, cached on base difficulty alone so the cache stays valid
  // as the player's history changes. Widened by the most a personal shift can move a
  // question, so pickQuestion has something to draw from in both directions.
  const rungPools = new Map();
  function rungPool(r){
    if(rungPools.has(r)) return rungPools.get(r);
    const [lo, hi] = rungWindow(r);
    const min = lo - MAX_SHIFT_UP, max = hi + MAX_SHIFT_DOWN;
    const pool = [];
    rungShapes(r).forEach(shape => eachPairOfShape(shape, (a, b) => {
      const d = difficulty(a, b);
      // Base difficulty is cached alongside the pair: it never changes, and
      // recomputing it for every candidate on every question is pure waste.
      if(d >= min && d <= max) pool.push([a, b, d]);
    }));
    rungPools.set(r, pool);
    return pool;
  }

  let recentQuestions = [];
  function pickQuestion(r){
    const candidates = rungPool(r);
    if(!candidates.length) return [7, 8];
    const [lo, hi] = rungWindow(r);

    const within = adjust => candidates.filter(([a, b, d]) => {
      const score = d + adjust(a, b);
      return score >= lo && score <= hi;
    });

    // Personal difficulty first; fall back to the general model, then to anything
    // in range, so a rung can never run out of questions.
    let pool = within(personalShift);
    if(!pool.length) pool = within(() => 0);
    if(!pool.length) pool = candidates;

    const fresh = pool.filter(p => !recentQuestions.includes(p[0] + 'x' + p[1]));
    const src = fresh.length ? fresh : pool;
    const [a, b] = src[Math.floor(Math.random() * src.length)];
    recentQuestions.push(a + 'x' + b);
    if(recentQuestions.length > 8) recentQuestions.shift();
    return Math.random() < 0.5 ? [a, b] : [b, a];   // show both orientations
  }

  // One shot per rung: the first number given, spoken or typed, is the answer.
  function askOnce(expected, statusEl, heardEl, inputEl, submitBtn, onVerdict){
    stopListening();
    let settled = false;

    const settle = (value, source) => {
      if(settled) return;
      settled = true;
      keepListening = false;
      stopListening();
      if(inputEl){ inputEl.onkeydown = null; inputEl.disabled = true; }
      if(submitBtn){ submitBtn.onclick = null; submitBtn.disabled = true; }
      const correct = value === expected;
      if(heardEl){
        heardEl.textContent = isNaN(value) ? '??' : value;
        heardEl.classList.remove('correct','incorrect');
        heardEl.classList.add(correct ? 'correct' : 'incorrect', 'visible');
      }
      onVerdict(correct, value, source);
    };

    const commitTyped = () => {
      const v = parseInt(inputEl.value, 10);
      if(!isNaN(v)) settle(v, 'typed');
    };

    if(inputEl){
      inputEl.disabled = false;
      inputEl.value = '';
      inputEl.focus();
      inputEl.onkeydown = e => { if(e.key === 'Enter') commitTyped(); };
    }
    if(submitBtn){
      submitBtn.disabled = false;
      submitBtn.onclick = commitTyped;
    }

    if(!SpeechRecognition){
      statusEl.textContent = 'Type your answer, then press Enter.';
      return;
    }

    keepListening = true;
    const startRecognition = () => {
      if(!keepListening || settled) return;
      const rec = new SpeechRecognition();
      activeRecognizer = rec;
      rec.lang = 'en-US';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.continuous = false;

      rec.onresult = e => {
        const transcript = Array.from(e.results).map(r => r[0].transcript).join(' ');
        const val = parseSpokenNumber(transcript);
        // A mis-hear must never cost a rung — only a number we actually parsed counts as an answer.
        if(isNaN(val)){
          statusEl.innerHTML = `<span class="bad">Didn't catch a number — say it again.</span>`;
          return;
        }
        settle(val, 'spoken');
      };
      rec.onerror = () => {};
      rec.onend = () => { if(keepListening && !settled) setTimeout(startRecognition, 250); };

      try { rec.start(); } catch(_) {}
    };

    statusEl.textContent = 'Say your answer or type it — first answer counts.';
    startRecognition();
  }

  function ladderRailHtml(current){
    let html = '';
    for(let r = 1; r <= LADDER_RUNGS; r++){
      const cls = ['rung', zoneOf(r).cls];
      if(r < current) cls.push('done');
      if(r === current) cls.push('current');
      if(r === state.bestRung && state.bestRung > current) cls.push('best-mark');
      html += `<div class="${cls.join(' ')}">${r === current ? '<span class="climber">🧗</span>' : ''}</div>`;
    }
    return html;
  }

  function startLadderMode(){
    stopListening();
    state.mode = 'ladder';
    if(!state.rung || state.rung < 1) state.rung = 1;
    if(!state.bestRung || state.bestRung < 1) state.bestRung = 1;
    recentQuestions = [];
    saveState();

    main.innerHTML = `
      <div class="card">
        <h2>Ladder Climb</h2>
        <p class="subtitle">Right answer climbs a rung. Wrong answer drops one. You can never be knocked out — only slowed down.</p>
        <div class="ladder-layout">
          <div class="ladder-rail" id="ladderRail"></div>
          <div class="ladder-play">
            <div class="rung-badge" id="rungBadge"></div>
            <div class="question" id="ladderQ">Ready?</div>
            <input type="number" id="answerInput" class="answer-input" placeholder="?">
            <div class="heard-wrapper"><div class="heard-label">Your answer:</div><div class="heard-number" id="ladderHeard"></div></div>
            <div class="voice-status" id="ladderStatus">Press Start to begin.</div>
            <button id="ladderSubmit">Check</button>
            <button id="ladderMenu" class="secondary">Menu</button>
          </div>
        </div>
      </div>`;

    const startZone = zoneOf(state.rung);
    document.getElementById('ladderRail').innerHTML = ladderRailHtml(state.rung);
    document.getElementById('rungBadge').innerHTML =
      `<span class="zone-tag ${startZone.cls}">${startZone.name}</span>Rung ${state.rung} of ${LADDER_RUNGS}`;
    document.getElementById('ladderMenu').onclick = () => { stopListening(); showModePicker(); };
    updateHeader();

    const startBtn = document.getElementById('ladderSubmit');
    startBtn.textContent = 'Start';
    startBtn.onclick = () => askLadderQuestion();
    document.getElementById('answerInput').disabled = true;
  }

  function askLadderQuestion(){
    const r = state.rung;
    const [a, b] = pickQuestion(r);
    const expected = a * b;
    const zone = zoneOf(r);

    const qEl      = document.getElementById('ladderQ');
    const statusEl = document.getElementById('ladderStatus');
    const heardEl  = document.getElementById('ladderHeard');
    const inputEl  = document.getElementById('answerInput');
    const submitEl = document.getElementById('ladderSubmit');

    document.getElementById('ladderRail').innerHTML = ladderRailHtml(r);
    document.getElementById('rungBadge').innerHTML =
      `<span class="zone-tag ${zone.cls}">${zone.name}</span>Rung ${r} of ${LADDER_RUNGS}`;
    qEl.textContent = `${a} × ${b} = ?`;
    heardEl.classList.remove('visible','correct','incorrect');
    submitEl.textContent = 'Check';
    updateHeader();

    askOnce(expected, statusEl, heardEl, inputEl, submitEl, correct => {
      recordAnswer(a, b, correct);
      if(correct){
        audioSuccess.play();
        if(r >= LADDER_RUNGS){
          state.bestRung = LADDER_RUNGS;
          saveState();
          statusEl.innerHTML = `<span class="good">That's the top!</span>`;
          setTimeout(ladderSummit, 900);
          return;
        }
        state.rung = r + 1;
        state.bestRung = Math.max(state.bestRung, state.rung);
        saveState();
        statusEl.innerHTML = `<span class="good">Correct — up to rung ${state.rung}!</span>`;
        document.getElementById('ladderRail').innerHTML = ladderRailHtml(state.rung);
        setTimeout(askLadderQuestion, 900);
      } else {
        audioFail.play();
        state.rung = Math.max(1, r - 1);
        saveState();
        const where = r > 1 ? `Down to rung ${state.rung}.` : 'You stay on rung 1.';
        statusEl.innerHTML = `<span class="bad">${a} × ${b} = ${expected}.</span> ${where}`;
        document.getElementById('ladderRail').innerHTML = ladderRailHtml(state.rung);
        setTimeout(askLadderQuestion, 2400);   // the fall is the teaching moment — let it land
      }
    });
  }

  function ladderSummit(){
    stopListening();
    audioLevelUp.play();
    main.innerHTML = `<div class="card">
      <h2>🏔️ You reached the top! 🏔️</h2>
      <p>All ${LADDER_RUNGS} rungs climbed — from 1 × 1 all the way to two-digit multiplications.</p>
    </div>`;
    setTimeout(() => {
      showOverlay(`
        <h2>Summit!</h2>
        <p>${CELEBRATIONS[Math.floor(Math.random()*CELEBRATIONS.length)]}</p>
        <button id="climbAgain">Climb Again</button>
        <button id="summitMenu" class="secondary">Menu</button>`);
      document.getElementById('climbAgain').onclick = () => {
        hideOverlay();
        state.rung = 1;
        startLadderMode();
      };
      document.getElementById('summitMenu').onclick = () => {
        hideOverlay();
        state.rung = 1;
        saveState();
        showModePicker();
      };
    }, 200);
  }

  // WIN
  function winGame(){
    stopListening();
    audioCountdown.pause();
    audioSuccess.play();
    main.innerHTML = `<div class="card"><h2>🎉 You Won the Game! 🎉</h2>
      <p>You finished all the tables!</p></div>`;
    setTimeout(()=>{
      showOverlay(`
        <h2>Congratulations!</h2>
        <p>Great work mastering your tables.</p>
        <button id="replay2">Play Again</button>`);
      document.getElementById('replay2').onclick = () => {
        audioCountdown.currentTime = 0;
        hideOverlay();
        startGame();
      };
    },200);
  }

  // SHUFFLE
  function shuffle(a){
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  // START
  startGame();

})();
</script>
</body>
</html>
