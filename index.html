<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Number Mania!</title>
  <style>
    :root {
      --primary: #4b9cff;
      --secondary: #ffcc4b;
      --bg: radial-gradient(circle at top left, #f7fbff, #dfe9f7);
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--bg);
      color: #0f1b2d;
      font-size: clamp(18px, 2vw, 22px);
    }

    header, footer {
      background: linear-gradient(90deg, #0f1b2d, #183c5a);
      color: #fff;
      padding: 18px 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      letter-spacing: 0.3px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #header-info { font-size: 1.2em; font-weight: 700; }
    #header-info span { margin: 0 8px; }

    button {
      padding: 16px 26px;
      margin: 8px;
      font-size: 1.05em;
      font-weight: 700;
      cursor: pointer;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #fff;
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    button:hover { transform: translateY(-1px); box-shadow: 0 10px 18px rgba(0,0,0,0.18); }
    button:active { transform: translateY(0); box-shadow: 0 4px 10px rgba(0,0,0,0.16); }
    button:disabled { background:#9fbada; cursor: not-allowed; box-shadow:none; }

    .secondary { background: var(--secondary); color: #1e2e3a; }

    .card {
      background: #fff;
      padding: clamp(22px, 3vw, 32px);
      border-radius: 18px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.15);
      max-width: 960px;
      width: 100%;
      text-align: center;
    }

    h1, h2, h3 { margin: 0 0 12px 0; font-weight: 800; }
    .subtitle { margin: 6px 0 18px; color: #354b63; }

    #wheelCanvas { border:4px solid #0f1b2d; border-radius:50%; max-width: 360px; width:100%; height:auto; }
    @keyframes spin { from { transform:rotate(0deg);} to{transform:rotate(360deg);} }
    #wheelCanvas.spinning { animation: spin 1s linear 3; }

    .question {
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 800;
      margin: 16px 0 12px;
      color: #0f1b2d;
    }

    .voice-status {
      font-size: 1.05em;
      color: #354b63;
      min-height: 32px;
      margin-bottom: 10px;
    }

    .bad { color: #c0392b; font-weight: 700; }
    .good { color: #1e8449; font-weight: 700; }

    table { border-collapse: collapse; margin: 18px auto; width: 100%; max-width: 640px; font-size: 1.05em; }
    td, th { border: 1px solid #c6d2e2; padding: 10px 14px; text-align: center; }
    th { background: #f1f6fb; }

    .table-picker {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(54px, 1fr));
      gap: 10px;
      margin: 14px 0 4px;
    }

    .table-choice {
      background: #f1f6fb;
      border: 2px solid #c6d2e2;
      color: #0f1b2d;
      border-radius: 12px;
      font-weight: 800;
      padding: 12px 0;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.1s ease, border-color 0.2s ease;
      box-shadow: 0 6px 12px rgba(0,0,0,0.12);
    }

    .table-choice:hover { transform: translateY(-1px); border-color: var(--primary); box-shadow: 0 10px 16px rgba(0,0,0,0.15); }
    .table-choice:active { transform: translateY(0); box-shadow: 0 6px 12px rgba(0,0,0,0.12); }

    .heard-wrapper { margin: 6px 0 2px; }
    .heard-label { font-size: 0.95em; color: #4b5f75; }
    .heard-number {
      min-height: clamp(3rem, 6vw, 4.4rem);
      font-size: clamp(2.8rem, 6vw, 4.8rem);
      font-weight: 900;
      text-shadow: 0 2px 6px rgba(0,0,0,0.2);
      opacity: 0;
      transform: translateY(8px) scale(0.96);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .heard-number.visible { opacity: 1; transform: translateY(0) scale(1); }
    .heard-number.correct { color: #1e8449; }
    .heard-number.incorrect { color: #c0392b; }
    /* A guess in progress: shown while they are still speaking, not a verdict */
    .heard-number.provisional { color: #7a8ea3; opacity: 0.5; }

    .table-preview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px;
      margin: 12px 0 4px;
      color: #1b3145;
      font-weight: 600;
    }

    #overlay {
      position:fixed; top:0; left:0; width:100%; height:100%;
      z-index: 300;   /* above the focus toggle, so dialogs are never overlapped */
      background:rgba(0,0,0,0.7);
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:1.2rem;
      padding: 14px;
    }
    #overlay .content {
      background:#112132;
      padding:28px;
      border-radius:14px;
      max-width: 520px;
      width: 100%;
      text-align:center;
      box-shadow:0 10px 22px rgba(0,0,0,0.35);
    }
    #overlay.hidden { display:none; }

    .answer-input {
      font-size: 2rem;
      padding: 12px;
      border-radius: 12px;
      border: 3px solid #c6d2e2;
      width: 160px;
      text-align: center;
      margin: 16px auto;
      display: block;
      color: #0f1b2d;
      font-weight: 800;
    }
    .answer-input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 12px rgba(75, 156, 255, 0.4);
    }
    .answer-input::placeholder {
      color: #cbd5e1;
      font-weight: 400;
    }
    /* Hide arrows for number input */
    .answer-input::-webkit-outer-spin-button,
    .answer-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .answer-input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
    .answer-input:disabled { background:#eef3f9; color:#7a8ea3; }

    /* MODE PICKER */
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      margin-top: 8px;
    }

    .mode-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: #f1f6fb;
      color: #0f1b2d;
      border: 2px solid #c6d2e2;
      padding: 24px 18px;
      text-align: center;
      white-space: normal;
    }

    /* Four sections abreast on a wide screen, two-by-two on a tablet */
    .mode-grid-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .mode-grid-4 .mode-card { padding: 18px 14px; }

    .mode-card:hover { border-color: var(--primary); }
    .mode-icon { font-size: 2.6rem; line-height: 1; }
    .mode-name { font-size: 1.15em; font-weight: 800; }
    .mode-desc { font-size: 0.78em; font-weight: 500; color: #41586f; line-height: 1.45; }

    /* LADDER MODE */
    .ladder-layout {
      display: flex;
      gap: 28px;
      align-items: stretch;
      justify-content: center;
      flex-wrap: wrap;
    }

    .ladder-rail {
      display: flex;
      flex-direction: column-reverse;
      gap: 4px;
      flex: 0 0 108px;
      width: 108px;
      /* Sized to the viewport so all 30 rungs are always in view — the whole point
         of the rail is seeing where you are, which fails the moment it scrolls. */
      height: min(430px, 48vh);
      padding: 10px 36px 10px 12px;
      background: linear-gradient(180deg, #eaf2fb, #dae6f4);
      border: 2px solid #c6d2e2;
      border-radius: 14px;
    }

    .ladder-play { flex: 1 1 320px; min-width: 270px; }

    .rung {
      position: relative;
      flex: 1 1 0;
      min-height: 5px;
      border-radius: 4px;
      background: #fff;
      border-left: 5px solid #cbd8e7;
      box-shadow: inset 0 0 0 1px #dae3ee;
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .rung.z1 { border-left-color: #3fa96a; }
    .rung.z2 { border-left-color: #3d8fd6; }
    .rung.z3 { border-left-color: #d59b1f; }
    .rung.z4 { border-left-color: #e07a3c; }
    .rung.z5 { border-left-color: #c0392b; }

    .rung.done { background: #a9d0f7; }
    .rung.current {
      background: var(--secondary);
      /* Widened by margin, not transform: a transform would scale the climber too. */
      margin-right: -7px;
      box-shadow: 0 0 12px rgba(255, 204, 75, 0.85);
    }

    .rung .climber {
      position: absolute;
      right: -32px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.45rem;
      line-height: 1;
    }

    .rung.best-mark::after {
      content: '★';
      position: absolute;
      right: -20px;
      top: -6px;
      color: #e0a800;
      font-size: 0.85rem;
    }

    .rung-badge { font-weight: 800; color: #1b3145; margin-bottom: 4px; }

    .zone-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.68em;
      color: #fff;
      margin-right: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .zone-tag.z1 { background: #3fa96a; }
    .zone-tag.z2 { background: #3d8fd6; }
    .zone-tag.z3 { background: #d59b1f; }
    .zone-tag.z4 { background: #e07a3c; }
    .zone-tag.z5 { background: #c0392b; }

    /* Always-available controls — they stay put when focus mode hides the header */
    .floating-controls {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 200;
      display: flex;
      gap: 6px;
    }

    .floating-btn {
      margin: 0;
      padding: 8px 13px;
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1;
      border-radius: 10px;
      background: rgba(15, 27, 45, 0.5);
      color: #fff;
      box-shadow: none;
      opacity: 0.55;
      transition: opacity 0.2s ease, background 0.2s ease;
    }

    .floating-btn:hover {
      opacity: 1;
      background: rgba(15, 27, 45, 0.88);
      transform: none;
      box-shadow: none;
    }

    /* Muted is a state worth seeing at a glance, not a subtle icon swap */
    .floating-btn.muted {
      opacity: 1;
      background: #c0392b;
    }

    .floating-btn.muted:hover { background: #d0483a; }

    /* ON-SCREEN KEYPAD */
    .keypad {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      z-index: 250;
      width: min(340px, 100%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px;
      background: #112132;
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -8px 26px rgba(0, 0, 0, 0.32);
    }

    .keypad.hidden { display: none; }

    /* Lift the page clear of the pad so it never covers the question or the box */
    body.keypad-open main { padding-bottom: 290px; }

    .keypad .key {
      margin: 0;
      padding: 12px 0;
      font-size: 1.45rem;
      font-weight: 800;
      border-radius: 10px;
      background: #24405c;
      color: #fff;
      box-shadow: none;
    }

    .keypad .key:hover { background: #2f5478; }
    .keypad .key:hover,
    .keypad .key:active { transform: none; box-shadow: none; }
    .keypad .key-fn { background: #3b4457; font-size: 1.25rem; }
    .keypad .key-send { background: #1e8449; font-size: 1.05rem; }

    .keypad .key-reverse {
      grid-column: 1 / -1;
      padding: 10px 0;
      font-size: 0.82rem;
      background: #3b4457;
      letter-spacing: 0.3px;
    }

    .keypad .key-reverse.on { background: var(--secondary); color: #1e2e3a; }
    .keypad .key-reverse.on:hover { background: #ffd76b; }

    /* While units-first is on, the box fills from the right — say so */
    .answer-input.units-first {
      border-color: #e0a800;
      box-shadow: 0 0 12px rgba(224, 168, 0, 0.35);
    }

    body.focus-mode header,
    body.focus-mode footer,
    body.focus-mode .subtitle,
    body.focus-mode .heard-label { display: none; }

    body.focus-mode main { padding: 10px; }

    body.focus-mode .card {
      max-width: 1100px;
      padding: 14px clamp(14px, 3vw, 30px);
      border-radius: 14px;
    }

    /* The heading still says which table you're on — demoted to a caption, not removed. */
    body.focus-mode .card > h2 {
      font-size: 0.8em;
      font-weight: 700;
      color: #51687e;
      margin-bottom: 4px;
    }

    body.focus-mode .ladder-rail { height: min(620px, 76vh); }
    body.focus-mode .question { font-size: clamp(2.6rem, 8vw, 5rem); margin: 10px 0 8px; }
    body.focus-mode .answer-input { font-size: 2.6rem; width: 210px; margin: 12px auto; }
    body.focus-mode .heard-number { font-size: clamp(3rem, 8vw, 5.6rem); }
    body.focus-mode .rung-badge { font-size: 0.9em; }
  </style>
</head>
<body>

<div class="floating-controls">
  <button id="micBtn" class="floating-btn" type="button" title="Mute the microphone" aria-label="Mute the microphone" aria-pressed="false">🎤</button>
  <button id="langBtn" class="floating-btn" type="button" title="Language" aria-label="Language: English">🌐 EN</button>
  <button id="focusBtn" class="floating-btn" type="button" title="Fullscreen" aria-label="Enter fullscreen">⛶</button>
</div>

<header>
  <div id="header-info">
    <span id="levelDisplay">Level: 1</span>
  </div>
  <button id="highScoresBtn" class="secondary" type="button">My Progress</button>
</header>

<main id="main"></main>

<footer>
  <button id="resetBtn" type="button">Reset Progress</button>
</footer>

<div id="overlay" class="hidden">
  <div class="content" id="overlayContent"></div>
</div>

<div id="keypad" class="keypad hidden" role="group" aria-label="Number keypad"></div>

<script>
(() => {
  // AUDIO
  const audioSuccess   = new Audio('success.mp3');
  const audioCountdown = new Audio('countdown.mp3');
  const audioSpin      = new Audio('spin.mp3');
  const audioLevelUp   = new Audio('level-up.mp3');
  const audioFail      = new Audio('fail.mp3');

  // Restart from the top every time: replaying an Audio element that is still
  // playing is a no-op, which silently swallows sounds during a fast streak.
  function playSfx(audio){
    try {
      audio.currentTime = 0;
      const p = audio.play();
      if(p && p.catch) p.catch(() => {});
    } catch(_) {}
  }

  // SPEECH
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let activeRecognizer = null;
  let keepListening = false;
  let voiceControl = null;   // restart handle for the question currently being asked

  const LANGUAGES = [
    { code:'en-US', label:'EN', name:'English' },
    { code:'ca-ES', label:'CA', name:'Català' }
  ];
  const LANG_KEY = 'mulSpeechLang';
  let speechLang = 'en-US';

  // Muting is a deliberate choice, so everywhere it applies the game falls back to
  // the keypad quietly rather than complaining that voice is unavailable.
  const MIC_KEY = 'mulMicMuted';
  let micMuted = false;
  const voiceAvailable = () => !!SpeechRecognition && !micMuted;

  // How the player answered last time, so the next question opens the same way
  // instead of making them reach for the keypad again on every single question.
  const INPUT_KEY = 'mulInputMode';
  let preferredInput = 'voice';   // 'voice' | 'keypad'

  function setPreferredInput(mode){
    if(mode !== 'voice' && mode !== 'keypad') return;
    preferredInput = mode;
    const store = storage();
    if(store) try { store.setItem(INPUT_KEY, mode); } catch(_) {}
  }

  // KEYS
  const GAME_KEY = 'mulGameState';
  const HS_KEY   = 'mulTableTimes';

  // ================= UI LANGUAGE =================
  // One setting drives both the recogniser and the interface: a child answering in
  // Catalan should be reading Catalan. Values are either plain strings or functions
  // of whatever the sentence needs, so word order stays the translator's business
  // rather than being fixed by concatenation at the call site.

    'en-US': {
      appName:'Number Mania', progressBtn:'My Progress', resetBtn:'Reset Progress',
      headerRung:(icon,r,total,best)=>`${icon} Rung ${r} of ${total} — best ${best}`,

      'op.add.name':'Sums',           'op.add.short':'Addition',

      'op.div.name':'Divisions',      'op.div.short':'Division',
      'op.add.blurb':'Adding, from 1 + 1 up to carrying across three digits.',
      'op.sub.blurb':'Taking away, including borrowing across columns.',
      'op.mul.blurb':'All the tables mixed, up to two-digit work like 25 × 46.',
      'op.div.blurb':'Sharing out exactly — every answer is a whole number.',

      ladderName:'Ladder Climb',
      ladderDesc:total=>`${total} rungs of rising difficulty. Right answer climbs, wrong answer drops one — you're never out.`,
      resumeRung:r=>` You're on rung ${r}.`,
      tablesName:'Tables Adventure',
      tablesDesc:'Pick or spin a single table, then work it from adding up to a timed quiz.',
      allSections:'← All sections',
      confirmClimb:r=>`Continue your climb at rung ${r}?`,
      confirmLevel:n=>`Continue at Level ${n}?`,
      confirmReset:'Clear progress, recorded times & what the ladder has learned about you?',

      ladderTitle:(icon,short)=>`${icon} ${short} Ladder`,
      ladderSubtitle:"Right climbs a rung, wrong drops one — you're never knocked out.",

      rungOf:(r,total)=>`Rung ${r} of ${total}`,

    'ca-ES': {
      appName:'Mania dels Nombres', progressBtn:'El meu progrés', resetBtn:'Esborra el progrés',
      headerRung:(icon,r,total,best)=>`${icon} Graó ${r} de ${total} — millor ${best}`,
      headerLevel:n=>`Nivell: ${n}`,

      voiceLangTitle:name=>`Idioma: ${name} — toca per canviar`,

  let uiLang = 'en-US';

  function t(key, ...args){
    const table = STRINGS[uiLang] || STRINGS['en-US'];
    // Fall back to English for anything a translation has not covered, so a missing
    // key shows a real sentence rather than a raw identifier.
    const val = table[key] !== undefined ? table[key] : STRINGS['en-US'][key];
    if(val === undefined) return key;
    return typeof val === 'function' ? val(...args) : val;
  }

  const opName  = op => t('op.' + op.key + '.name');
  const opShort = op => t('op.' + op.key + '.short');
  const opBlurb = op => t('op.' + op.key + '.blurb');
  const zoneName = zone => t('zone.' + zone.name);
  const celebrate = () => {
    const list = t('celebrations');
    return list[Math.floor(Math.random() * list.length)];
  };

  // Whatever screen is showing, so switching language can redraw it in place.
  let repaintScreen = null;

  let tableStartTime = null;

  // STATE
  const state = { level:1, currentTable:null, mode:null, op:null, ladders:{} };

  function saveState(){ localStorage.setItem(GAME_KEY, JSON.stringify(state)); }
  function loadState(){
    const s = localStorage.getItem(GAME_KEY);
    if(!s) return;
    const saved = JSON.parse(s);
    // A climb saved before there were four operations was a multiplication climb.
    if(saved.rung !== undefined && !saved.ladders){
      saved.ladders = { mul: { rung: saved.rung, best: saved.bestRung || saved.rung } };
    }
    delete saved.rung;
    delete saved.bestRung;
    Object.assign(state, saved);
    if(!state.ladders) state.ladders = {};
  }
  function clearState(){ localStorage.removeItem(GAME_KEY); }

  function getHighScores(){
    const v = localStorage.getItem(HS_KEY);
    return v ? JSON.parse(v) : [];
  }
  function saveHighScore(table, timeSeconds, init){
    const hs = getHighScores();
    hs.push({ table, timeSeconds, initials:init, date:new Date().toLocaleDateString() });
    hs.sort((a,b)=>a.timeSeconds - b.timeSeconds);
    localStorage.setItem(HS_KEY, JSON.stringify(hs.slice(0,10)));
  }

  // UI
  const main          = document.getElementById('main');
  const overlay       = document.getElementById('overlay');
  const overlayContent= document.getElementById('overlayContent');
  const levelDisplay  = document.getElementById('levelDisplay');

  function updateHeader(){
    if(state.mode === 'ladder'){
      const op = OPS[state.op] || OPS.mul, l = ladderState(op.key);
      levelDisplay.textContent = t('headerRung', op.icon, l.rung, LADDER_RUNGS, l.best);
    } else if(state.mode === 'tables'){
      levelDisplay.textContent = t('headerLevel', state.level);
    } else {
      levelDisplay.textContent = t('appName');
    }
    saveState();
  }

  function showOverlay(html){
    stopListening();
    overlayContent.innerHTML = html;
    overlay.classList.remove('hidden');
  }
  function hideOverlay(){
    overlay.classList.add('hidden');
  }

  document.getElementById('highScoresBtn').onclick = () => {

    if(confirm(t('confirmReset'))){
      clearState();

  // SPEECH HELPERS
  // Silences the microphone but leaves the question in flight, so the keypad can
  // take over and hand control back.
  function stopRecognizer(){
    keepListening = false;
    if(activeRecognizer){
      activeRecognizer.onresult = null;
      activeRecognizer.onerror = null;
      activeRecognizer.onend = null;
      // abort() rather than stop(): we never want the pending final result once we
      // are tearing down, and it frees the microphone immediately instead of
      // leaving a restart to race a session that is still winding down.
      try { activeRecognizer.abort(); } catch(_) {}
      activeRecognizer = null;
    }
  }

  // Ends the question too: any pending pause/resume handle is dropped, so a stale
  // resume can never revive a recognizer for a screen that has moved on.
  function stopListening(){
    voiceControl = null;
    stopRecognizer();
  }

  function requireSpeechRecognition(){
    if(!SpeechRecognition){
      showOverlay(`<h2>${t('voiceOffTitle')}</h2><p>${t('voiceOffBody')}</p>`);
      return false;
    }
    return true;
  }

  // Spoken number words per language. Homophones are folded in because speech
  // recognition regularly returns "won" for one or "ate" for eight.
  const NUMBER_WORDS = {
    'en-US': {
      zero:0, oh:0, o:0, owe:0,
      one:1, won:1, two:2, too:2, to:2, three:3, four:4, for:4, fore:4, five:5,
      six:6, seven:7, eight:8, ate:8, nine:9, ten:10,
      eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, sixteen:16,
      seventeen:17, eighteen:18, nineteen:19,
      twenty:20, thirty:30, forty:40, fourty:40, fifty:50, sixty:60, seventy:70,
      eighty:80, ninety:90,
      hundred:100, hundreds:100, thousand:1000, thousands:1000
    },
    'ca-ES': {
      zero:0,
      u:1, un:1, una:1, dos:2, dues:2, tres:3, quatre:4, cinc:5, sis:6, set:7,
      vuit:8, huit:8, nou:9, deu:10,
      onze:11, dotze:12, tretze:13, catorze:14, quinze:15, setze:16,
      disset:17, dèsset:17, divuit:18, devuit:18, dinou:19, dènou:19,
      vint:20, trenta:30, quaranta:40, cinquanta:50, seixanta:60, setanta:70,
      vuitanta:80, huitanta:80, noranta:90,
      cent:100, cents:100, centes:100, mil:1000
    }
  };

  // "i" joins tens to units in Catalan (vint-i-un); "and" does the same in English.
  // "number" and "número" are here so a child may say "number twenty four" for the
  // extra context it gives the recogniser, without the prefix being required.
  const NUMBER_JOINERS = new Set(['i', 'and', 'y', 'number', 'numero', 'número', 'nombre']);

  function parseSpokenNumber(text, lang){
    if(!text) return NaN;
    const map = NUMBER_WORDS[lang || speechLang] || NUMBER_WORDS['en-US'];

    // Digits and words are tokenised together. Chrome regularly returns a mixture —
    // "20 for" for twenty four, "fifty 6" for fifty six — and reading only the first
    // digit run, as this used to, threw away the rest of the answer.
    const tokens = text.toLowerCase()
      .replace(/[^0-9a-zàèéíòóúïüç\s-]/g, ' ')
      .split(/[\s-]+/)
      .filter(Boolean);

    const values = [];
    tokens.forEach(tok => {
      if(NUMBER_JOINERS.has(tok)) return;
      if(/^\d+$/.test(tok)){ values.push(parseInt(tok, 10)); return; }
      const val = map[tok];
      if(val !== undefined) values.push(val);
    });
    if(!values.length) return NaN;

    // Several single digits in a row are the answer being spelled out — "1 5" and
    // "two four" mean 15 and 24, not 6. Anything larger is being said as a number,
    // so it accumulates: "20 for" and "fifty 6" are 24 and 56.
    if(values.length > 1 && values.every(v => v >= 0 && v <= 9)){
      return parseInt(values.join(''), 10);
    }

    let total = 0, current = 0;
    values.forEach(val => {
      if(val === 1000){
        total += Math.max(1, current) * 1000;   // "tres mil" / "three thousand"
        current = 0;
      } else if(val === 100){
        current = Math.max(1, current) * 100;   // "dos-cents" / "two hundred"
      } else if(val >= 1000){
        total += val;                           // already a whole number, e.g. "1150"
      } else {
        current += val;
      }
    });
    return total + current;
  }

  // True when any hypothesis the recogniser offered reads as the expected answer.
  // Only ever used to accept, never to reject, so a lucky alternative can rescue a
  // correct answer but no alternative can mark a wrong one right.
  function matchesExpected(results, expected){
    return results.some(res => {
      for(let i = 0; i < res.length; i++){
        if(parseSpokenNumber(res[i].transcript) === expected) return true;
      }
      return false;
    });
  }

  function listenForNumber(expected, statusEl, onCorrect, onMismatch, heardEl, inputEl){
    // A muted mic is a choice and falls through to the keypad; a browser with no
    // speech at all still gets told why.
    if(!micMuted && !requireSpeechRecognition()) return;
    stopListening();
    keepListening = true;

    if(inputEl){
      inputEl.value = '';
      // Not auto-focused: that would pop the keypad and mute the microphone before
      // the player has chosen how to answer.
      inputEl.oninput = () => {
        if(parseInt(inputEl.value, 10) === expected){
          inputEl.oninput = null;
          const val = parseInt(inputEl.value, 10);
          statusEl.innerHTML = `<span class="good">${t('typedCorrect', val)}</span>`;
          playSfx(audioSuccess);
          setPreferredInput('keypad');
          hideKeypad();
          stopListening();
          setTimeout(() => onCorrect('typed', val), 600);
        }
      };
      // This mode checks on every keystroke, so Send only needs to answer for a
      // number that isn't right yet — otherwise the key would feel dead.
      inputEl._submit = () => {
        const val = parseInt(inputEl.value, 10);
        if(isNaN(val) || val === expected) return;
        showHeard(val, false);
        onMismatch && onMismatch(val, String(val));
        statusEl.innerHTML = `<span class="bad">${t('tryAgain', val)}</span>`;
        inputEl.value = '';
      };
    }

    let heardTimeout = null;
    let startFailures = 0;

    const showHeard = (val, isCorrect) => {
      if(!heardEl) return;
      heardEl.textContent = isNaN(val) ? '??' : val;
      heardEl.classList.remove('correct','incorrect','provisional','visible');
      heardEl.classList.add(isCorrect ? 'correct' : 'incorrect','visible');
      clearTimeout(heardTimeout);
      heardTimeout = setTimeout(()=>{
        heardEl.classList.remove('visible');
      }, 2000);
    };

    const startRecognition = () => {
      if(!keepListening) return;
      statusEl.textContent = t('listening');
      const rec = new SpeechRecognition();
      activeRecognizer = rec;
      rec.lang = speechLang;
      // See askOnce: interim results are what make this feel immediate instead of
      // waiting on Chrome's end-of-speech detection.
      rec.interimResults = true;
      rec.maxAlternatives = 5;   // see askOnce: a homophone often ranks above the number
      rec.continuous = false;

      rec.onresult = (e) => {
        const results = Array.from(e.results);
        const transcript = results.map(r => r[0].transcript).join(' ');
        const isFinal = results.some(r => r.isFinal);
        const val = parseSpokenNumber(transcript);

        // A matching interim is accepted straight away; a wrong one waits for the
        // final, so a half-heard answer never gets called wrong.
        if(val === expected || matchesExpected(results, expected)){
          if(inputEl) inputEl.oninput = null;
          // Report the expected value, not the top guess: when a lower-ranked
          // alternative is what matched, the top guess is the wrong word.
          showHeard(expected, true);
          setPreferredInput('voice');
          stopListening();
          statusEl.innerHTML = `<span class="good">${t('heardCorrect', transcript.trim(), expected)}</span>`;
          playSfx(audioSuccess);
          setTimeout(() => onCorrect(transcript.trim(), expected), 600);
          return;
        }
        if(!isFinal){
          if(!isNaN(val) && heardEl){
            heardEl.textContent = val;
            heardEl.classList.remove('correct','incorrect');
            heardEl.classList.add('provisional','visible');
          }
          return;
        }
        showHeard(val, false);
        onMismatch && onMismatch(val, transcript.trim());
        statusEl.innerHTML = `<span class="bad">${t('heardWrong', transcript.trim(), isNaN(val) ? null : val)}</span>`;
      };

      rec.onerror = () => {
        statusEl.textContent = t('troubleHearing');
      };

      rec.onend = () => {
        if(keepListening) setTimeout(startRecognition, 150);
      };

      try {
        rec.start();
        startFailures = 0;
      } catch(_) {
        // See askOnce: a failed start fires no onend, so it must retry itself.
        activeRecognizer = null;
        if(++startFailures <= 8) setTimeout(startRecognition, 300);
        else statusEl.innerHTML = `<span class="bad">${t('micBusy')}</span>`;
      }
    };

    voiceControl = {
      restart(){
        stopRecognizer();
        if(!voiceAvailable()) return;
        keepListening = true;
        startFailures = 0;
        setTimeout(startRecognition, 120);
      }
    };

    if(voiceAvailable()){
      startRecognition();
    } else {
      keepListening = false;
      statusEl.textContent = t('micOffStatus');
      if(inputEl) showKeypad(inputEl);   // the only way in while the mic is off
      return;
    }
    // Carry the last question's choice into this one; voice stays live regardless.
    if(preferredInput === 'keypad' && inputEl) showKeypad(inputEl);
  }

  // FLOW
  function startGame(){
    stopListening();
    loadState();
    showHomeMenu();
  }

  // The home menu: one card per operation, each showing how far that climb has got.
  function showHomeMenu(){
    stopListening();
    repaintScreen = showHomeMenu;
    state.mode = null;
    state.op = null;
    updateHeader();

    const cards = OP_KEYS.map(k => {
      const op = OPS[k], l = ladderState(k);
      const progress = l.best > 1 ? t('bestSoFar', l.best, LADDER_RUNGS) : t('notStarted');
      return `
        <button class="mode-card" data-op="${k}">
          <span class="mode-icon">${op.icon}</span>
          <span class="mode-name">${opName(op)}</span>
          <span class="mode-desc">${opBlurb(op)}<br><b>${progress}</b></span>
        </button>`;
    }).join('');

    main.innerHTML = `
      <div class="card">
        <h2>${t('homeTitle')}</h2>
        <p class="subtitle">${t('homeSubtitle')}</p>
        <div class="mode-grid mode-grid-4">${cards}</div>
      </div>`;

    main.querySelectorAll('[data-op]').forEach(btn =>
      btn.onclick = () => showOperationMenu(OPS[btn.dataset.op]));
  }

  // One operation's menu. Every operation has the ladder; multiplication also keeps
  // Tables Adventure, whose stages are about times tables specifically.
  function showOperationMenu(op){
    stopListening();
    repaintScreen = () => showOperationMenu(op);
    state.mode = null;
    state.op = op.key;
    ladderOp = op;
    updateHeader();

    const l = ladderState(op.key);
    const resume = l.rung > 1 ? t('resumeRung', l.rung) : '';
    const tables = op.key === 'mul' ? `
      <button class="mode-card" id="modeTables">
        <span class="mode-icon">🎡</span>
        <span class="mode-name">${t('tablesName')}</span>
        <span class="mode-desc">${t('tablesDesc')}</span>
      </button>` : '';

    main.innerHTML = `
      <div class="card">
        <h2>${op.icon} ${opShort(op)}</h2>
        <p class="subtitle">${opBlurb(op)}</p>
        <div class="mode-grid">
          <button class="mode-card" id="modeLadder">
            <span class="mode-icon">🪜</span>
            <span class="mode-name">${t('ladderName')}</span>
            <span class="mode-desc">${t('ladderDesc', LADDER_RUNGS)}${resume}</span>
          </button>
          ${tables}
        </div>
        <button id="backHome" class="secondary">${t('allSections')}</button>
      </div>`;

    document.getElementById('backHome').onclick = showHomeMenu;
    document.getElementById('modeLadder').onclick = () => {
      if(l.rung > 1 && !confirm(t('confirmClimb', l.rung))) l.rung = 1;
      startLadderMode(op);
    };
    const tablesBtn = document.getElementById('modeTables');
    if(tablesBtn) tablesBtn.onclick = startTablesMode;
  }

  function startTablesMode(){
    stopListening();
    state.mode = 'tables';
    const hasProgress = state.level>1 || state.currentTable;
    if(hasProgress && confirm(t('confirmLevel', state.level))){
      nextStep();
    } else {
      state.level=1; state.currentTable=null;
      saveState();
      pickTable();
    }
  }

  function pickTable(){
    stopListening();
    repaintScreen = pickTable;
    main.innerHTML = `
      <div class="card">
        <h2>${t('chooseTable')}</h2>
        <p class="subtitle">${t('chooseTableSub')}</p>

        <div class="voice-status" id="pickStatus">${t('selectTable')}</div>

      </div>`;

    document.querySelectorAll('.table-choice').forEach(btn=>{
      btn.onclick = () => {
        const val = parseInt(btn.dataset.table,10);

          <h2>${t('tableSelected', val)}</h2>

  function nextStep(){
    updateHeader();
    if(state.level>10) return winGame();
    if(state.level%2===1) spinWheel();
    else                    startQuiz();
  }

  // WHEEL
  function spinWheel(){
    stopListening();
    repaintScreen = spinWheel;
    main.innerHTML = `
      <div class="card">
        <h2>${t('spinTitle')}</h2>
        <canvas id="wheelCanvas" width="360" height="360"></canvas>
        <p class="subtitle">${t('spinSub')}</p>
        <button id="spinBtn">${t('spinBtn')}</button>
      </div>`;
    const canvas = document.getElementById('wheelCanvas');
    const ctx    = canvas.getContext('2d');
    const R=160, seg=10;
    for(let i=0;i<seg;i++){
      const a=(i/seg)*2*Math.PI;
      ctx.beginPath();
      ctx.moveTo(180,180);
      ctx.arc(180,180,R, a, a+2*Math.PI/seg);
      ctx.fillStyle=`hsl(${i*36},70%,60%)`;
      ctx.fill(); ctx.stroke();
      ctx.save();
      ctx.translate(180,180);
      ctx.rotate(a+Math.PI/seg);
      ctx.fillStyle='#000';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText(i+1, R*0.6,8);
      ctx.restore();
    }
    ctx.fillStyle='red';
    ctx.beginPath();
    ctx.moveTo(180,16); ctx.lineTo(166,50); ctx.lineTo(194,50);
    ctx.fill();

    const btn = document.getElementById('spinBtn');
    btn.onclick = () => {
      playSfx(audioSpin);
      btn.disabled = true;
      canvas.classList.add('spinning');
      setTimeout(()=>{
        canvas.classList.remove('spinning');
        const pick = Math.floor(Math.random()*10)+1;
        state.currentTable = pick;
        tableStartTime = null;
        saveState();
        playSfx(audioLevelUp);
        showOverlay(`
          <h2>${t('tablePicked', pick)}</h2>
          <p>${celebrate()}</p>
          <p>${t('listenNoTyping')}</p>
          <button id="gotable">${t('go')}</button>`);
        document.getElementById('gotable').onclick = () => {
          hideOverlay();
          startAdditionPractice();
        };
      },3000);
    };
  }

  // QUIZ (even levels)

    main.innerHTML = `

      listenForNumber(expected, statusEl, () => {
        // One record per question: the quiz retries until correct, so "did they get

        recordAnswer(OPS.mul, n, questions[qIdx], !missedThis);
        qIdx++;
        if(qIdx>=questions.length){

          playSfx(audioLevelUp);

          if(init) saveHighScore(n, totalTime, init);

  // ================= DIFFICULTY MODEL =================
  // Every question in every operation is generated from one base pair (a, b).
  // Multiplication asks a x b; division asks (a x b) / b, so it inherits the
  // multiplication order exactly. Addition asks a + b; subtraction asks
  // (a + b) - b. That is not a shortcut: undoing a fact is the same fact, and a
  // subtraction needs a borrow in precisely the columns its addition carried.

  // All 55 unique multiplication facts, easiest first. A taught order, not a
  // computed one: the x1 and x10 tables are cleared as whole blocks before the
  // rest interleaves, squares are grouped early because they get memorised as a
  // set, and the x9 facts sit high because the 10x-x trick is one more step, not
  // one fewer. Edit this list to change what the multiplication ladder asks.
  const MUL_ORDER = [
    [1,1],  [1,10], [1,2],  [1,5],  [1,3],  [1,4],  [1,9],  [1,6],  [1,7],  [1,8],
    [10,10],[10,2], [10,5], [10,3], [10,4], [10,9], [10,6], [10,7], [10,8],
    [2,2],  [2,5],  [2,3],  [2,4],  [2,6],  [3,3],  [5,5],  [2,7],  [3,4],  [2,9],
    [4,4],  [2,8],  [5,3],  [5,4],  [5,6],  [6,6],  [7,7],  [9,9],  [5,7],  [5,9],
    [5,8],  [3,6],  [3,7],  [4,6],  [3,8],  [8,8],  [3,9],  [4,9],  [4,7],  [4,8],
    [9,6],  [9,7],  [9,8],  [6,7],  [6,8],  [7,8]
  ];

  // The same idea for the 55 addition facts. Here the ordering signals are
  // counting-on (+1, +2), adding ten, doubles and near-doubles being chunked, and
  // crossing ten being the step that actually costs something — which is why
  // 6+8, 7+9 and 7+8 land at the top while 9+10 stays near the bottom.
  const ADD_ORDER = [
    [1,1],  [1,10], [1,2],  [10,10],[2,2],  [2,10], [1,3],  [2,3],  [3,10], [3,3],
    [1,4],  [1,5],  [1,9],  [4,10], [5,10], [2,4],  [1,6],  [2,5],  [9,10], [4,4],
    [5,5],  [1,7],  [3,4],  [1,8],  [6,10], [2,6],  [3,5],  [7,10], [8,10], [4,5],
    [2,7],  [2,8],  [3,6],  [3,7],  [4,6],  [2,9],  [9,9],  [6,6],  [3,9],  [7,7],
    [8,8],  [5,6],  [3,8],  [4,9],  [5,9],  [8,9],  [4,7],  [4,8],  [5,7],  [6,7],
    [5,8],  [6,9],  [7,8],  [7,9],  [6,8]
  ];

  // Both orientations share one rank: 2 x 5 and 5 x 2 are one fact.
  function buildRanks(order){
    const ranks = {};
    order.forEach(([a, b], i) => { ranks[a + ':' + b] = i; ranks[b + ':' + a] = i; });
    return ranks;
  }
  const MUL_RANK = buildRanks(MUL_ORDER);
  const ADD_RANK = buildRanks(ADD_ORDER);

  // Position in the order, spread evenly over 0-100.
  function orderScore(ranks, size, a, b){
    if(!a || !b) return 0;
    const rank = ranks[a + ':' + b];
    return rank === undefined ? 0 : Math.round(100 * rank / (size - 1));
  }

  const factScore    = (a, b) => orderScore(MUL_RANK, MUL_ORDER.length, a, b);
  const addFactScore = (a, b) => orderScore(ADD_RANK, ADD_ORDER.length, a, b);

  const digitsOf = n => String(n).split('').map(Number);

  // Columns that carry when a and b are added. A subtraction borrows in exactly
  // these columns, so the same count scores both operations.
  function addCarryCount(a, b){
    const x = digitsOf(a).reverse(), y = digitsOf(b).reverse();
    let carry = 0, count = 0;
    for(let i = 0; i < Math.max(x.length, y.length); i++){
      carry = Math.floor(((x[i] || 0) + (y[i] || 0) + carry) / 10);
      if(carry > 0) count++;
    }
    return count;
  }

  // Multi-digit addition. Carrying is the whole difficulty; digit count only sets
  // how much bookkeeping surrounds it.
  function addWideScore(a, b){
    const digits = Math.max(String(a).length, String(b).length);
    // Two digits is the entry point and costs nothing extra: 11 + 2 is genuinely
    // easier than 7 + 8, and charging for the width would leave a gap between the
    // hardest fact and the cheapest wide sum that no question could fill.
    let s = 20 * (digits - 2);
    s += 14 * addCarryCount(a, b);
    s += 6 * Math.max(0, String(a + b).length - 2);
    if(String(a).length > 1 && String(b).length > 1) s += 10;   // two wide operands
    return Math.max(0, Math.round(s));
  }

  // Carries generated while multiplying a multi-digit number by one digit.
  function partialCarries(multi, single){
    let carry = 0, count = 0;
    digitsOf(multi).reverse().forEach(d => {
      carry = Math.floor((d * single + carry) / 10);
      if(carry > 0) count++;
    });
    return count;
  }

  // Carries generated while adding the partial products together.
  function sumCarries(nums){
    const cols = nums.map(n => String(n).split('').reverse().map(Number));
    const len = Math.max(...cols.map(c => c.length));
    let carry = 0, count = 0;
    for(let i = 0; i < len; i++){
      carry = Math.floor((carry + cols.reduce((t, c) => t + (c[i] || 0), 0)) / 10);
      if(carry > 0) count++;
    }
    return count;
  }

  // Multi-digit difficulty. Carry load matters far more than digit count.
  // Scored in the order you'd write it out — longer number on top — so that
  // 47 x 3 and 3 x 47 are worth the same, and orientation is purely cosmetic.
  function multiScore(a0, b0){
    if(String(b0).length > String(a0).length || (String(b0).length === String(a0).length && b0 > a0)){
      [a0, b0] = [b0, a0];
    }
    const strip = n => { let z = 0; while(n % 10 === 0 && n > 0){ n /= 10; z++; } return [n, z]; };
    const [a, za] = strip(a0), [b, zb] = strip(b0);
    const da = digitsOf(a), db = digitsOf(b);

    let s = 22 * (da.length * db.length - 1);              // size of the digit-product grid
    da.forEach(x => db.forEach(y => { s += factScore(x, y) / 6; }));  // hardness of each pair
    db.forEach(y => { if(y) s += 7 * partialCarries(a, y); });        // carries within partials

    const partials = db.map((y, i) => a * y * Math.pow(10, db.length - 1 - i)).filter(p => p !== 0);
    if(partials.length > 1) s += 5 * sumCarries(partials);           // carries in the final sum

    s += 4 * (za + zb);                                    // trailing zeros are a shift, not a product
    s += 6 * Math.max(0, String(a0 * b0).length - 2);       // a big answer is more to hold and say
    return Math.max(0, Math.round(s));
  }

  // ================= OPERATIONS =================
  // Each operation says how a base pair becomes a question, how hard that pair is,
  // and how its 30 rungs are laid out. Everything downstream — pools, the ladder,
  // the personal history — is driven from this table and never names an operation.
  //
  // Unified scale per operation: single-digit facts occupy 0-100 and anything wider
  // floors at 100, so no two-digit question can appear before the facts are cleared.
  const OPS = {
    add: {
      key:'add', name:'Sums', short:'Addition', icon:'➕', symbol:'+',
      blurb:'Adding, from 1 + 1 up to carrying across three digits.',
      fact: addFactScore, wide: addWideScore, offset: 0,
      render: (a, b) => `${a} + ${b}`,
      answer: (a, b) => a + b,
      anchors: [[1,2],[7,45],[14,96],[16,106],[20,128],[25,155],[30,180]],
      shapes: r => r <= 14 ? ['1x1']
                 : r <= 18 ? ['1x1','1x2']
                 : r <= 23 ? ['1x2','2x2']
                 : r <= 27 ? ['2x2','1x3']
                           : ['2x2','1x3','3x3']
    },
    sub: {
      key:'sub', name:'Subtractions', short:'Subtraction', icon:'➖', symbol:'−',
      blurb:'Taking away, including borrowing across columns.',
      fact: addFactScore, wide: addWideScore, offset: 8,   // undoing costs a little more
      render: (a, b) => `${a + b} − ${b}`,
      answer: (a, b) => a,
      anchors: [[1,10],[7,53],[14,104],[16,114],[20,136],[25,163],[30,188]],
      shapes: r => r <= 14 ? ['1x1']
                 : r <= 18 ? ['1x1','1x2']
                 : r <= 23 ? ['1x2','2x2']
                 : r <= 27 ? ['2x2','1x3']
                           : ['2x2','1x3','3x3']
    },
    mul: {
      key:'mul', name:'Multiplications', short:'Multiplication', icon:'✖️', symbol:'×',
      blurb:'All the tables mixed, up to two-digit work like 25 × 46.',
      fact: factScore, wide: multiScore, offset: 0,
      render: (a, b) => `${a} × ${b}`,
      answer: (a, b) => a * b,
      anchors: [[1,2],[6,30],[12,58],[18,95],[21,120],[24,150],[27,195],[30,265]],
      shapes: r => r <= 18 ? ['1x1']
                 : r <= 23 ? ['1x1','1x2']
                 : r <= 27 ? ['1x2','1x3','2x2']
                           : ['2x2','1x3','2x3']
    },
    div: {
      key:'div', name:'Divisions', short:'Division', icon:'➗', symbol:'÷',
      blurb:'Sharing out exactly — every answer is a whole number.',
      fact: factScore, wide: multiScore, offset: 10,   // harder than the fact it undoes
      render: (a, b) => `${a * b} ÷ ${b}`,
      answer: (a, b) => a,
      anchors: [[1,12],[6,40],[12,68],[18,105],[21,130],[24,160],[27,205],[30,272]],
      shapes: r => r <= 18 ? ['1x1']
                 : r <= 23 ? ['1x1','1x2']
                 : r <= 27 ? ['1x2','1x3','2x2']
                           : ['2x2','1x3','2x3']
    }
  };

  const OP_KEYS = ['add','sub','mul','div'];

  function difficulty(op, a, b){
    const base = (a <= 10 && b <= 10) ? op.fact(a, b) : 100 + op.wide(a, b);
    return base + op.offset;
  }

  // ================= PERSONAL HISTORY =================
  // The scores above are what's hard for children in general. This layer is what's
  // hard for *this* child: a question they keep missing drifts up the ladder toward
  // the rungs they actually spend their time on, and one they've mastered drifts down.
  const MAX_SHIFT_UP   = 25;    // furthest a personal weakness can push a question up
  const MAX_SHIFT_DOWN = 12;    // furthest a mastered question can drift down
  const PRIOR_ATTEMPTS = 2;     // pseudo-attempts, so one slip doesn't swing the estimate
  const PRIOR_MISS     = 0.25;  // miss rate assumed before we know anything

  const storage = () => { try { return typeof localStorage === 'undefined' ? null : localStorage; } catch(_) { return null; } };

  const emptyBook = () => ({ facts:{}, shapes:{} });

  let stats = (() => {
    const blank = () => { const s = {}; OP_KEYS.forEach(k => s[k] = emptyBook()); return s; };
    try {
      const store = storage();
      const raw = store && JSON.parse(store.getItem('mulFactStats'));
      if(raw && raw.facts && raw.shapes){
        // Everything recorded before there were four operations was multiplication.
        const migrated = blank();
        migrated.mul = raw;
        return migrated;
      }
      if(raw && typeof raw === 'object'){
        const merged = blank();
        OP_KEYS.forEach(k => { if(raw[k] && raw[k].facts && raw[k].shapes) merged[k] = raw[k]; });
        return merged;
      }
    } catch(_) {}
    return blank();
  })();

  function saveStats(){
    const store = storage();
    if(store) try { store.setItem('mulFactStats', JSON.stringify(stats)); } catch(_) {}
  }

  const bookFor = op => stats[op.key] || (stats[op.key] = emptyBook());

  // Single-digit facts are tracked one by one; wider questions are tracked by shape,
  // because there are unboundedly many and missing 25 x 46 says nothing about 25 x 47.
  function questionKey(a, b){
    if(a <= 10 && b <= 10){
      const [x, y] = a <= b ? [a, b] : [b, a];
      return { bucket:'facts', key: x + ':' + y };
    }
    const da = String(a).length, db = String(b).length;
    const [x, y] = da <= db ? [da, db] : [db, da];
    return { bucket:'shapes', key: x + 'd:' + y + 'd' };
  }

  function recordAnswer(op, a, b, correct){
    const { bucket, key } = questionKey(a, b);
    const book = bookFor(op)[bucket];
    const rec = book[key] || (book[key] = { n:0, w:0 });
    rec.n++;
    if(!correct) rec.w++;
    saveStats();
  }

  // How far this player's own history moves a question on the difficulty scale.
  function personalShift(op, a, b){
    const { bucket, key } = questionKey(a, b);
    const rec = bookFor(op)[bucket][key];
    if(!rec || !rec.n) return 0;
    // Smoothed against a prior so the first miss doesn't declare a fact "hard".
    const missRate = (rec.w + PRIOR_ATTEMPTS * PRIOR_MISS) / (rec.n + PRIOR_ATTEMPTS);
    const delta = missRate - PRIOR_MISS;
    return delta >= 0
      ? Math.round(MAX_SHIFT_UP   * Math.min(1,  delta / (1 - PRIOR_MISS)))
      : Math.round(MAX_SHIFT_DOWN * Math.max(-1, delta / PRIOR_MISS));
  }

  function personalDifficulty(op, a, b){
    return difficulty(op, a, b) + personalShift(op, a, b);
  }

  function trickiestFacts(op, limit){
    return Object.entries(bookFor(op).facts)
      .filter(([, r]) => r.n >= 2 && r.w > 0)
      .map(([key, r]) => {
        const [a, b] = key.split(':').map(Number);
        return { key, label: op.render(a, b), misses: r.w, attempts: r.n, rate: r.w / r.n };
      })
      .sort((x, y) => y.rate - x.rate || y.misses - x.misses)
      .slice(0, limit);
  }

  // ================= LADDER MODE =================
  const LADDER_RUNGS = 30;

  // Difficulty centre of each rung, interpolated between the operation's anchors.
  function rungCenter(op, r){
    const anchors = op.anchors;
    for(let i = 0; i < anchors.length - 1; i++){
      const [r1, c1] = anchors[i], [r2, c2] = anchors[i+1];
      if(r >= r1 && r <= r2) return c1 + (c2 - c1) * (r - r1) / (r2 - r1);
    }
    return anchors[anchors.length - 1][1];
  }

  // Window around the centre a question may be drawn from.
  const rungHalfWidth = r => r <= 4 ? 14 : (r <= 18 ? 9 : 16);

  const ZONES = [
    { max:6,  name:'Ground', cls:'z1' },
    { max:12, name:'Lower',  cls:'z2' },
    { max:18, name:'Middle', cls:'z3' },
    { max:23, name:'Upper',  cls:'z4' },
    { max:30, name:'Summit', cls:'z5' }
  ];
  const zoneOf = r => ZONES.find(z => r <= z.max) || ZONES[ZONES.length - 1];

  // Operand shapes, shared by every operation; which ones a rung may serve is the
  // operation's business, so big numbers can never arrive early.
  const SHAPES = {
    '1x1': visit => { for(let a=1;a<=10;a++)     for(let b=a;b<=10;b++)   visit(a,b); },
    '1x2': visit => { for(let a=11;a<=99;a++)    for(let b=2;b<=9;b++)    visit(a,b); },
    '2x2': visit => { for(let a=11;a<=99;a++)    for(let b=a;b<=99;b++)   visit(a,b); },
    '1x3': visit => { for(let a=101;a<=999;a+=2) for(let b=2;b<=9;b++)    visit(a,b); },
    '2x3': visit => { for(let a=101;a<=999;a+=7) for(let b=11;b<=99;b++)  visit(a,b); },
    '3x3': visit => { for(let a=101;a<=999;a+=5) for(let b=a;b<=999;b+=5) visit(a,b); }
  };

  const rungWindow = (op, r) => {
    const c = rungCenter(op, r), h = rungHalfWidth(r);
    return [c - h, c + h];
  };

  // Candidates for a rung, cached on base difficulty alone so the cache stays valid
  // as the player's history changes. Widened by the most a personal shift can move a
  // question, so pickQuestion has something to draw from in both directions.
  const rungPools = new Map();
  function rungPool(op, r){
    const cacheKey = op.key + '#' + r;
    if(rungPools.has(cacheKey)) return rungPools.get(cacheKey);
    const [lo, hi] = rungWindow(op, r);
    const min = lo - MAX_SHIFT_UP, max = hi + MAX_SHIFT_DOWN;
    const pool = [];
    op.shapes(r).forEach(shape => SHAPES[shape]((a, b) => {
      const d = difficulty(op, a, b);
      // Base difficulty is cached alongside the pair: it never changes, and
      // recomputing it for every candidate on every question is pure waste.
      if(d >= min && d <= max) pool.push([a, b, d]);
    }));
    rungPools.set(cacheKey, pool);
    return pool;
  }

  let recentQuestions = [];
  function pickQuestion(op, r){
    const candidates = rungPool(op, r);
    if(!candidates.length) return [7, 8];
    const [lo, hi] = rungWindow(op, r);

    const within = adjust => candidates.filter(([a, b, d]) => {
      const score = d + adjust(a, b);
      return score >= lo && score <= hi;
    });

    // Personal difficulty first; fall back to the general model, then to anything
    // in range, so a rung can never run out of questions.
    let pool = within((a, b) => personalShift(op, a, b));
    if(!pool.length) pool = within(() => 0);
    if(!pool.length) pool = candidates;

    const fresh = pool.filter(p => !recentQuestions.includes(p[0] + ':' + p[1]));
    const src = fresh.length ? fresh : pool;
    const [a, b] = src[Math.floor(Math.random() * src.length)];
    recentQuestions.push(a + ':' + b);
    if(recentQuestions.length > 8) recentQuestions.shift();
    return Math.random() < 0.5 ? [a, b] : [b, a];   // show both orientations
  }

  // One shot per rung: the first number given, spoken or typed, is the answer.
  function askOnce(expected, statusEl, heardEl, inputEl, submitBtn, onVerdict){
    stopListening();
    let settled = false;

    // What the recogniser thinks it is hearing, before it has committed to it.
    const showProvisional = value => {
      if(!heardEl || settled) return;
      heardEl.textContent = value;
      heardEl.classList.remove('correct','incorrect');
      heardEl.classList.add('provisional','visible');
    };

    const settle = (value, source) => {
      if(settled) return;
      settled = true;
      setPreferredInput(source === 'spoken' ? 'voice' : 'keypad');
      hideKeypad();
      stopListening();
      if(inputEl){ inputEl.onkeydown = null; inputEl.disabled = true; inputEl.blur(); }
      if(submitBtn){ submitBtn.onclick = null; submitBtn.disabled = true; }
      const correct = value === expected;
      if(heardEl){
        heardEl.textContent = isNaN(value) ? '??' : value;
        heardEl.classList.remove('correct','incorrect','provisional');
        heardEl.classList.add(correct ? 'correct' : 'incorrect', 'visible');
      }
      onVerdict(correct, value, source);
    };

    const commitTyped = () => {
      const v = parseInt(inputEl.value, 10);
      if(!isNaN(v)) settle(v, 'typed');
    };

    if(inputEl){
      inputEl.disabled = false;
      inputEl.value = '';
      // Deliberately not focused: focusing opens the keypad, which would mute the
      // microphone before the player has chosen how they want to answer.
      inputEl.onkeydown = e => { if(e.key === 'Enter') commitTyped(); };
      inputEl._submit = commitTyped;
    }
    if(submitBtn){
      submitBtn.disabled = false;
      submitBtn.onclick = commitTyped;
    }

    keepListening = false;
    let startFailures = 0;
    const startRecognition = () => {
      if(!keepListening || settled) return;
      const rec = new SpeechRecognition();
      activeRecognizer = rec;
      rec.lang = speechLang;
      // Interim results are the difference between reacting while the child is still
      // speaking and waiting for Chrome to decide the utterance ended, finalise it,
      // and only then hand it over — which is most of the delay people feel.
      rec.interimResults = true;
      // Chrome's top guess for an isolated number is often a homophone while its
      // second or third is the number itself. Asking for several and accepting any
      // that reads as the right answer costs the child nothing.
      rec.maxAlternatives = 5;
      rec.continuous = false;

      rec.onresult = e => {
        const results = Array.from(e.results);
        const transcript = results.map(r => r[0].transcript).join(' ');
        const isFinal = results.some(r => r.isFinal);
        const val = parseSpokenNumber(transcript);

        // Accept early only on a match. An interim that already reads as the right
        // answer is safe: the recogniser is telling us they said it. An interim
        // that reads as a wrong one may still be refined, so it waits for the
        // final — a mis-hear must never cost a rung.
        if(val === expected || matchesExpected(results, expected)){
          settle(expected, 'spoken');
          return;
        }

        if(!isFinal){
          if(!isNaN(val)) showProvisional(val);
          return;
        }
        if(isNaN(val)){
          statusEl.innerHTML = `<span class="bad">${t('noNumber')}</span>`;
          return;
        }
        settle(val, 'spoken');
      };
      rec.onerror = () => {};
      rec.onend = () => { if(keepListening && !settled) setTimeout(startRecognition, 150); };

      try {
        rec.start();
        startFailures = 0;
      } catch(_) {
        // start() throws while a previous session is still releasing the microphone.
        // onend never fires for a start that failed, so without this retry the mic
        // stays dead for the rest of the question.
        activeRecognizer = null;
        if(++startFailures <= 8) setTimeout(startRecognition, 300);
        else statusEl.innerHTML = `<span class="bad">${t('micBusy')}</span>`;
      }
    };

    voiceControl = {
      // The language switch and unmuting need this: a running recognizer is locked
      // to the language it started with. The keypad never stops the microphone.
      restart(){
        if(settled) return;
        stopRecognizer();
        if(!voiceAvailable()) return;
        keepListening = true;
        startFailures = 0;
        statusEl.textContent = t('sayOrKeypad');
        setTimeout(startRecognition, 120);
      }
    };

    // Armed before the availability check below, so that a question started while
    // the mic is muted still has a handle for unmuting to bring voice back. Without
    // that, muting and unmuting left the microphone dead for the whole question.
    if(!voiceAvailable()){
      statusEl.textContent = t(micMuted ? 'micOffStatus' : 'tapKeys');
      if(inputEl) showKeypad(inputEl);   // the only way in, so don't make them ask
      return;
    }

    keepListening = true;
    statusEl.textContent = t('sayOrKeypad');
    startRecognition();

    // Open the keypad the way they answered last time. Voice keeps running
    // underneath, so either route stays live and neither can wedge the other.
    if(preferredInput === 'keypad' && inputEl) showKeypad(inputEl);
  }

  // Per-operation climb, so progress in one never disturbs another.
  function ladderState(opKey){
    if(!state.ladders) state.ladders = {};
    const l = state.ladders[opKey] || (state.ladders[opKey] = { rung:1, best:1 });
    if(!l.rung || l.rung < 1) l.rung = 1;
    if(!l.best || l.best < 1) l.best = 1;
    return l;
  }

  let ladderOp = OPS.mul;

  function ladderRailHtml(current, best){
    let html = '';
    for(let r = 1; r <= LADDER_RUNGS; r++){
      const cls = ['rung', zoneOf(r).cls];
      if(r < current) cls.push('done');
      if(r === current) cls.push('current');
      if(r === best && best > current) cls.push('best-mark');
      html += `<div class="${cls.join(' ')}">${r === current ? '<span class="climber">🧗</span>' : ''}</div>`;
    }
    return html;
  }

  function paintRung(op, r){
    const l = ladderState(op.key);
    const zone = zoneOf(r);
    document.getElementById('ladderRail').innerHTML = ladderRailHtml(r, l.best);
    document.getElementById('rungBadge').innerHTML =
      `<span class="zone-tag ${zone.cls}">${zoneName(zone)}</span>${t('rungOf', r, LADDER_RUNGS)}`;
  }

  function startLadderMode(op){
    stopListening();
    repaintScreen = () => startLadderMode(op);
    ladderOp = op;
    state.mode = 'ladder';
    state.op = op.key;
    const l = ladderState(op.key);
    recentQuestions = [];
    saveState();

    main.innerHTML = `
      <div class="card">
        <h2>${t('ladderTitle', op.icon, opShort(op))}</h2>
        <p class="subtitle">${t('ladderSubtitle')}</p>
        <div class="ladder-layout">
          <div class="ladder-rail" id="ladderRail"></div>
          <div class="ladder-play">
            <div class="rung-badge" id="rungBadge"></div>
            <div class="question" id="ladderQ">${t('ready')}</div>
            <input type="number" inputmode="none" id="answerInput" class="answer-input" placeholder="?" autocomplete="off">
            <div class="heard-wrapper"><div class="heard-label">${t('yourAnswer')}</div><div class="heard-number" id="ladderHeard"></div></div>
            <div class="voice-status" id="ladderStatus">${t('pressStart')}</div>
            <button id="ladderSubmit">${t('check')}</button>
            <button id="ladderMenu" class="secondary">${t('menu')}</button>
          </div>
        </div>
      </div>`;

    paintRung(op, l.rung);
    document.getElementById('ladderMenu').onclick = () => { stopListening(); showOperationMenu(op); };
    updateHeader();

    const startBtn = document.getElementById('ladderSubmit');
    startBtn.textContent = t('start');
    startBtn.onclick = () => askLadderQuestion(op);
    document.getElementById('answerInput').disabled = true;
  }

  function askLadderQuestion(op){
    const l = ladderState(op.key);
    const r = l.rung;
    const [a, b] = pickQuestion(op, r);
    const expected = op.answer(a, b);

    const statusEl = document.getElementById('ladderStatus');
    const heardEl  = document.getElementById('ladderHeard');
    const inputEl  = document.getElementById('answerInput');
    const submitEl = document.getElementById('ladderSubmit');

    paintRung(op, r);
    document.getElementById('ladderQ').textContent = `${op.render(a, b)} = ?`;
    heardEl.classList.remove('visible','correct','incorrect');
    submitEl.textContent = t('check');
    updateHeader();

    askOnce(expected, statusEl, heardEl, inputEl, submitEl, correct => {
      recordAnswer(op, a, b, correct);
      const previousBest = l.best;
      if(correct){
        if(r >= LADDER_RUNGS){
          l.best = LADDER_RUNGS;
          saveState();
          statusEl.innerHTML = `<span class="good">${t('atTheTop')}</span>`;
          setTimeout(() => ladderSummit(op), 900);
          return;
        }
        l.rung = r + 1;
        l.best = Math.max(l.best, l.rung);
        saveState();
        // Reaching a new zone or a new personal best is this mode's level-up, so it
        // gets the level-up fanfare instead of the plain correct-answer chime.
        const climbedZone = zoneOf(l.rung) !== zoneOf(r);
        const newBest = l.rung > previousBest;
        playSfx(climbedZone || newBest ? audioLevelUp : audioSuccess);
        statusEl.innerHTML = climbedZone
          ? `<span class="good">${t('correctIntoZone', zoneName(zoneOf(l.rung)))}</span>`
          : `<span class="good">${t('correctUpTo', l.rung)}</span>`;
        paintRung(op, l.rung);
        setTimeout(() => askLadderQuestion(op), climbedZone ? 1200 : 900);
      } else {
        playSfx(audioFail);
        l.rung = Math.max(1, r - 1);
        saveState();
        const where = r > 1 ? t('downToRung', l.rung) : t('stayOnRung1');
        statusEl.innerHTML = `<span class="bad">${op.render(a, b)} = ${expected}.</span> ${where}`;
        paintRung(op, l.rung);
        setTimeout(() => askLadderQuestion(op), 2400);   // let the fall land, it's the teaching moment
      }
    });
  }

  function ladderSummit(op){
    stopListening();
    playSfx(audioLevelUp);
    repaintScreen = () => ladderSummit(op);
    main.innerHTML = `<div class="card">
      <h2>${t('summitTitle', opShort(op))}</h2>
      <p>${t('summitBody', LADDER_RUNGS)}</p>
    </div>`;
    setTimeout(() => {
      showOverlay(`
        <h2>${t('summit')}</h2>
        <p>${celebrate()}</p>
        <button id="climbAgain">${t('climbAgain')}</button>
        <button id="summitMenu" class="secondary">${t('menu')}</button>`);
      document.getElementById('climbAgain').onclick = () => {
        hideOverlay();
        ladderState(op.key).rung = 1;
        startLadderMode(op);
      };
      document.getElementById('summitMenu').onclick = () => {
        hideOverlay();
        ladderState(op.key).rung = 1;
        saveState();
        showOperationMenu(op);
      };
    }, 200);
  }

  // WIN
  function winGame(){
    stopListening();
    repaintScreen = null;
    audioCountdown.pause();
    playSfx(audioSuccess);
    main.innerHTML = `<div class="card"><h2>${t('winTitle')}</h2>
      <p>${t('winBody')}</p></div>`;
    setTimeout(()=>{
      showOverlay(`
        <h2>${t('congrats')}</h2>
        <p>${t('congratsBody')}</p>
        <button id="replay2">${t('playAgain')}</button>`);
      document.getElementById('replay2').onclick = () => {
        audioCountdown.currentTime = 0;
        hideOverlay();
        startGame();
      };
    },200);
  }

  // SHUFFLE
  function shuffle(a){
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  // ================= VOICE LANGUAGE =================
  const langBtn = document.getElementById('langBtn');

  const micBtn = document.getElementById('micBtn');

  function setMicMuted(on, remember){
    micMuted = !!on;
    micBtn.textContent = micMuted ? '🔇' : '🎤';
    micBtn.classList.toggle('muted', micMuted);
    micBtn.title = t(micMuted ? 'micUnmute' : 'micMute');
    micBtn.setAttribute('aria-label', micBtn.title);
    micBtn.setAttribute('aria-pressed', micMuted ? 'true' : 'false');
    if(remember){
      const store = storage();
      if(store) try { store.setItem(MIC_KEY, micMuted ? '1' : '0'); } catch(_) {}
    }
  }

  micBtn.onclick = () => {
    setMicMuted(!micMuted, true);
    if(micMuted){
      stopRecognizer();                       // silence it without ending the question
      const input = document.querySelector('.answer-input:not([disabled])');
      if(input) showKeypad(input);            // the only way in now, so open it
      const status = document.querySelector('.voice-status');
      if(status) status.textContent = t('micOffStatus');
    } else if(voiceControl){
      voiceControl.restart();
    }
  };

  // Chrome that lives outside main and so is never redrawn by a screen.
  function applyStaticStrings(){
    setMicMuted(micMuted, false);             // relabels in the current language
    document.getElementById('highScoresBtn').textContent = t('progressBtn');
    document.getElementById('resetBtn').textContent = t('resetBtn');
    keypad.setAttribute('aria-label', t('keypadLabel'));
    const sendKey = keypad.querySelector('.key-send');
    if(sendKey) sendKey.textContent = t('send');
    const backKey = keypad.querySelector('[data-key="back"]');
    if(backKey) backKey.setAttribute('aria-label', t('deleteDigit'));
    setUnitsFirst(unitsFirst, false);          // relabels the units-first key
    setFocusMode(document.body.classList.contains('focus-mode'), false);
  }

  function setSpeechLang(code, remember, repaint){
    const lang = LANGUAGES.find(l => l.code === code) || LANGUAGES[0];
    speechLang = lang.code;
    // One setting: answering in Catalan should mean reading Catalan.
    uiLang = lang.code;
    langBtn.textContent = '🎤 ' + lang.label;
    langBtn.setAttribute('aria-label', t('voiceLangLabel', lang.name));
    langBtn.title = t('voiceLangTitle', lang.name);
    applyStaticStrings();
    if(repaint && repaintScreen) repaintScreen();
    if(remember){
      const store = storage();
      if(store) try { store.setItem(LANG_KEY, lang.code); } catch(_) {}
    }
  }

  langBtn.onclick = () => {
    const next = LANGUAGES[(LANGUAGES.findIndex(l => l.code === speechLang) + 1) % LANGUAGES.length];
    setSpeechLang(next.code, true, true);
    // A recognizer already running is locked to the old language, so cycle it.
    if(voiceControl) voiceControl.restart();
  };

  // ================= ON-SCREEN KEYPAD =================
  // Opens when the answer box is tapped and mutes the microphone while it is up,
  // so a child typing isn't also being listened to. Closing hands voice back.
  const keypad = document.getElementById('keypad');
  let activeInput = null;

  // ===== KEYPAD DIGIT ORDER =====
  // Long multiplication produces its answer right to left, so units-first mode lets
  // 15678 be entered as 8, 7, 6, 5, 1 — each digit pushed onto the front.
  const MAX_ANSWER_DIGITS = 7;

  function applyDigit(value, digit, unitsFirstMode){
    if(value.length >= MAX_ANSWER_DIGITS) return value;
    return unitsFirstMode ? digit + value : value + digit;
  }

  // Backspace always undoes the digit entered most recently, which in units-first
  // mode is the leftmost one — not the last character.
  function applyBackspace(value, unitsFirstMode){
    return unitsFirstMode ? value.slice(1) : value.slice(0, -1);
  }
  // ===== END KEYPAD DIGIT ORDER =====

  const REVERSE_KEY = 'mulUnitsFirst';
  let unitsFirst = false;

  function setUnitsFirst(on, remember){
    unitsFirst = !!on;
    const btn = keypad.querySelector('.key-reverse');
    if(btn){
      btn.classList.toggle('on', unitsFirst);
      btn.textContent = t(unitsFirst ? 'unitsFirstOn' : 'unitsFirstOff');
      btn.setAttribute('aria-pressed', unitsFirst ? 'true' : 'false');
    }
    document.querySelectorAll('.answer-input').forEach(el =>
      el.classList.toggle('units-first', unitsFirst));
    if(remember){
      const store = storage();
      if(store) try { store.setItem(REVERSE_KEY, unitsFirst ? '1' : '0'); } catch(_) {}
    }
  }

  keypad.innerHTML =
      `<button type="button" class="key key-reverse" data-key="reverse" aria-pressed="false">⇠ Units first — off</button>`
    + ['1','2','3','4','5','6','7','8','9'].map(d =>
      `<button type="button" class="key" data-key="${d}">${d}</button>`).join('')
    + `<button type="button" class="key key-fn" data-key="back" aria-label="Delete last digit">⌫</button>`
    + `<button type="button" class="key" data-key="0">0</button>`
    + `<button type="button" class="key key-send" data-key="send">Send</button>`;

  const keypadOpen = () => !keypad.classList.contains('hidden');

  function showKeypad(input){
    activeInput = input;
    input.classList.toggle('units-first', unitsFirst);
    keypad.classList.remove('hidden');
    document.body.classList.add('keypad-open');
    // Scroll by exactly the overlap, not to centre: centring throws the whole page
    // around, and usually the box is already clear of the pad.
    const box = input.getBoundingClientRect();
    const overlap = box.bottom + 16 - keypad.getBoundingClientRect().top;
    if(overlap > 0) window.scrollBy(0, overlap);
    // The microphone deliberately keeps running. Stopping and restarting it around
    // the keypad was fragile: a start() that lands while the previous session is
    // still releasing the mic throws, fires no onend, and leaves voice dead.
  }

  // byUser means the player dismissed it themselves, which is them choosing voice
  // for the next question. Closing it because the answer landed says nothing.
  function hideKeypad(byUser){
    if(!keypadOpen()) return;
    keypad.classList.add('hidden');
    document.body.classList.remove('keypad-open');
    activeInput = null;
    if(byUser) setPreferredInput('voice');
  }

  function pressKey(key){
    if(!activeInput) return;
    if(key === 'send'){
      // Submit first. A valid answer settles the question, which closes the pad
      // itself; an empty box leaves the pad up rather than dropping the player
      // back into voice with nothing entered.
      if(typeof activeInput._submit === 'function') activeInput._submit();
      else hideKeypad();
      return;
    }
    if(key === 'reverse'){ setUnitsFirst(!unitsFirst, true); return; }
    activeInput.value = key === 'back'
      ? applyBackspace(activeInput.value, unitsFirst)
      : applyDigit(activeInput.value, key, unitsFirst);
    activeInput.dispatchEvent(new Event('input', { bubbles: true }));
  }

  // pointerdown rather than click, with the default suppressed: pressing a key must
  // not blur the answer box, or the pad would close under the finger.
  keypad.addEventListener('pointerdown', e => {
    e.preventDefault();
    const btn = e.target.closest('.key');
    if(btn) pressKey(btn.dataset.key);
  });

  document.addEventListener('pointerdown', e => {
    const input = e.target.closest('.answer-input');
    if(input){
      if(input.disabled) return;
      // Focus is what summons the device keyboard, and it would fight our own pad
      // for the bottom of the screen. On touch the field never takes focus at all;
      // the pad writes to it directly, so nothing is lost. A mouse still focuses it
      // so a physical keyboard and Enter keep working.
      if(e.pointerType === 'touch') e.preventDefault();
      showKeypad(input);
    } else if(!e.target.closest('.keypad')){
      hideKeypad(true);
    }
  });

  // Keyboard users get the pad too, without it stealing focus from anything else.
  document.addEventListener('focusin', e => {
    const input = e.target.closest && e.target.closest('.answer-input');
    if(input && !input.disabled) showKeypad(input);
  });

  // ================= FOCUS MODE =================
  // Two separate things, driven by one button: the layout that hides everything
  // but the question, and real browser fullscreen. The layout stands on its own
  // where fullscreen isn't allowed — iOS Safari won't fullscreen a non-video element.
  const focusBtn = document.getElementById('focusBtn');
  const FOCUS_KEY = 'mulFocusMode';

  const inBrowserFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

  function setFocusMode(on, remember){
    document.body.classList.toggle('focus-mode', on);
    focusBtn.textContent = on ? '✕' : '⛶';
    focusBtn.title = t(on ? 'exitFullscreen' : 'fullscreen');
    focusBtn.setAttribute('aria-label', focusBtn.title);
    if(remember){
      const store = storage();
      if(store) try { store.setItem(FOCUS_KEY, on ? '1' : '0'); } catch(_) {}
    }
  }

  function requestBrowserFullscreen(){
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(!req) return;
    // Prefixed implementations return undefined rather than a promise.
    try { const p = req.call(el); if(p && p.catch) p.catch(() => {}); } catch(_) {}
  }

  function exitBrowserFullscreen(){
    if(!inBrowserFullscreen()) return;
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if(!exit) return;
    try { const p = exit.call(document); if(p && p.catch) p.catch(() => {}); } catch(_) {}
  }

  focusBtn.onclick = () => {
    const goingIn = !document.body.classList.contains('focus-mode');
    setFocusMode(goingIn, true);
    if(goingIn) requestBrowserFullscreen(); else exitBrowserFullscreen();
  };

  // Esc leaves browser fullscreen without going through the button — keep them in step.
  ['fullscreenchange','webkitfullscreenchange'].forEach(evt =>
    document.addEventListener(evt, () => { if(!inBrowserFullscreen()) setFocusMode(false, true); }));

  // The stripped-back layout is a preference worth keeping; fullscreen itself
  // can't be restored without a fresh gesture, so only the layout comes back.
  (() => {
    const store = storage();
    let savedFocus = null, savedLang = null, savedInput = null, savedReverse = null, savedMic = null;
    if(store) try {
      savedFocus   = store.getItem(FOCUS_KEY);
      savedLang    = store.getItem(LANG_KEY);
      savedInput   = store.getItem(INPUT_KEY);
      savedReverse = store.getItem(REVERSE_KEY);
      savedMic     = store.getItem(MIC_KEY);
    } catch(_) {}
    micMuted = savedMic === '1';
    setUnitsFirst(savedReverse === '1', false);
    setFocusMode(savedFocus === '1', false);
    setSpeechLang(savedLang || 'en-US', false, false);
    if(savedInput === 'keypad' || savedInput === 'voice') preferredInput = savedInput;
  })();

  // START
  startGame();

})();
</script>
</body>
</html>
